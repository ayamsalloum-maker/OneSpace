.recharge-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.recharge-experience,.recharge-visual{display:none!important}
.home-overview{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:22px;border-radius:28px;background:linear-gradient(145deg,#f8e5eb,#f8edd9 58%,#e6f2ed);border:1px solid rgba(45,38,55,.06)}
.home-overview-copy h2{font-family:var(--display);font-size:31px;margin:4px 0 5px}
.home-overview-copy p{font-size:13px;color:var(--muted);margin:0;max-width:620px}
.home-group .house-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.housecat-top{display:flex;align-items:center;justify-content:space-between}
.home-count{font-size:10px!important;font-weight:850;color:var(--muted)}
.housecat-pics{display:flex;gap:4px;margin-top:10px}
.housecat-pics i{width:31px;height:31px;border-radius:9px;background:center/cover no-repeat;border:1px solid var(--line)}
.wish-placeholder{font-size:30px}
.home-empty-action{aspect-ratio:1.15/1;border:1px dashed rgba(45,38,55,.20);border-radius:18px;background:rgba(255,255,255,.52);display:grid;place-items:center;text-align:center;padding:15px}
.home-empty-action span{font-size:28px}
.home-empty-action b{font-size:13px}
.home-empty-action small{font-size:10px;color:var(--muted)}
.goal-visual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.goal-visual-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;text-align:left;padding:0}
.goal-photo{height:118px;background:center/cover no-repeat}
.goal-photo.placeholder{display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#f5eadb,#eeeafb)}
.goal-copy{padding:12px}
.goal-copy b{display:block;font-size:14px}
.goal-copy span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.goal-copy i{display:block;height:5px;background:#eeeae5;border-radius:99px;margin-top:10px;overflow:hidden}
.goal-copy i em{display:block;height:100%;background:linear-gradient(90deg,var(--us),var(--us2));border-radius:99px}
.goal-preview-photo{height:180px;border-radius:18px;background:center/cover no-repeat;margin-top:10px}
.glimpse-goal-photo{position:absolute;right:12px;top:12px;width:70px;height:70px;border-radius:18px;background:center/cover no-repeat;opacity:.88;border:1px solid rgba(45,38,55,.07)}
.glimpse.money .eyebrow,.glimpse.money h3,.glimpse.money .money-flow-mini{position:relative;z-index:2}
.glimpse.money h3{max-width:72%}
.learn-topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.learn-topic{border:1px solid var(--line);border-radius:22px;background:#fff;padding:16px;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:.18s ease}
.learn-topic:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.learn-topic h3{font-family:var(--display);font-size:22px;margin:4px 0 6px}
.learn-topic p{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.learn-topic .learn-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.learn-topic.done{background:linear-gradient(145deg,#fff,#f3f7ef);border-color:rgba(99,145,108,.24)}
.learning-session{display:grid;gap:12px}
.learning-steps{display:grid;gap:9px}
.learning-step{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.learning-step i{width:32px;height:32px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-weight:900}
.learning-step b{display:block;font-size:14px}
.learning-step p{font-size:13px;color:var(--muted);margin:4px 0 0}
.learning-example{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--soft) 55%,#fff);padding:12px 14px;border-radius:0 16px 16px 0}
.learning-example b{display:block;font-size:13px}
.learning-example p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.learning-saved{padding:10px 12px;border-radius:14px;background:var(--greenSoft);color:#4f6c54;font-size:13px}
.us-stage{position:relative;overflow:hidden;border:1px solid rgba(45,38,55,.06);border-radius:42px 42px 12px 42px;padding:clamp(24px,5vw,50px);background:linear-gradient(135deg,var(--usSoft) 0%,var(--usSand) 55%,var(--paper) 100%)!important}
.us-stage:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:50%;top:-170px;transform:translateX(-50%);background:rgba(255,255,255,.45)}
.us-stage>*{position:relative;z-index:2}
.connection-orbit{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:10px}
.us-person-node{border:0;background:rgba(255,255,255,.68);border-radius:24px;padding:14px;display:flex;align-items:center;gap:11px;text-align:left;min-height:92px}
.us-person-node.aya{box-shadow:inset 0 0 0 1px rgba(238,118,95,.12)}
.us-person-node.mohamad{box-shadow:inset 0 0 0 1px rgba(23,125,146,.12)}
.us-face{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;background:#fff;font-family:var(--display);font-size:19px;font-weight:900;box-shadow:var(--shadow2)}
.us-person-node b{display:block;font-size:15px}
.us-person-node small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.us-heart{display:grid;place-items:center}
.us-heart span{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--us);font-size:22px;box-shadow:var(--shadow2)}
.us-deck{margin-top:14px;background:rgba(255,255,255,.64);border-radius:26px;display:grid;grid-template-columns:.78fr 1.22fr;gap:14px;align-items:stretch;padding:30px 0}
.us-modes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.us-mode{min-height:48px;border:1px solid rgba(45,38,55,.08);background:rgba(255,255,255,.75);border-radius:15px;font-size:12px;font-weight:850}
.us-mode.on{background:var(--ink);color:#fff}
.us-card{padding:16px;display:flex;flex-direction:column;justify-content:center;min-height:145px;border-radius:34px 34px 34px 8px!important;box-shadow:none!important;border:0!important;background:linear-gradient(120deg,var(--usSoft),var(--usSand) 58%,var(--paper))!important}
.us-card .eyebrow{margin-bottom:5px}
.us-card b{font-family:var(--display);font-size:21px;line-height:1.25}
.us-card .row{margin-top:12px}
.us-keepbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.us-keep{min-height:44px;border-radius:999px;border:1px solid rgba(45,38,55,.08);background:rgba(255,255,255,.76);padding:9px 13px;font-size:12px;font-weight:850}
.life-film{margin-top:14px;border-radius:30px;background:#fff;border:1px solid var(--line);padding:16px}
.life-film-head{display:flex;align-items:end;justify-content:space-between;gap:12px}
.life-film-head h3{font-family:var(--display);font-size:25px;margin:3px 0}
.life-track{display:grid;grid-template-columns:1.25fr .9fr .9fr;gap:10px;margin-top:12px}
.life-scene{border:0;border-radius:22px;padding:15px;text-align:left;min-height:170px;position:relative;overflow:hidden}
.life-scene.home{background:linear-gradient(145deg,#f8ead8,#f6e1e7)}
.life-scene.money{background:linear-gradient(145deg,#edf3e6,#f7efd9)}
.life-scene.memories{background:linear-gradient(145deg,#e5eff8,#f0e8f7)}
.life-scene h4{font-family:var(--display);font-size:21px;margin:5px 0}
.life-scene p{font-size:12px;color:var(--muted);margin:0}
.life-scene .memory-film{margin-top:11px}
.life-scene .money-flow-mini{margin-top:18px}
.life-scene:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-35px;bottom:-45px;background:rgba(255,255,255,.38)}
.future-thread{display:flex;gap:8px;overflow:auto;padding:11px 0 0;scrollbar-width:none}
.future-thread::-webkit-scrollbar{display:none}
.future-chip{flex:0 0 auto;min-width:150px;border:1px solid var(--line);background:#fff;border-radius:17px;padding:11px 12px;text-align:left}
.future-chip b{display:block;font-size:13px}
.future-chip span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.life-switch{position:sticky;top:76px;z-index:40;display:flex;gap:5px;width:max-content;max-width:100%;margin:0 auto 20px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,252,248,.9);backdrop-filter:blur(12px)}
.life-switch a{padding:9px 16px;border-radius:999px;color:var(--muted);font-size:12px;font-weight:850}
.life-switch a:hover{background:var(--mohSoft);color:var(--moh)}
.sport-stage{display:grid;grid-template-columns:1fr 150px;gap:28px;align-items:center;padding:24px;border-radius:28px;background:linear-gradient(145deg,#d9f1ed,#e1eaff 62%,#f6e8bd)}
.sport-stage h3{font-family:var(--display);font-size:30px;margin:4px 0 7px}
.sport-stage p{color:var(--muted);font-size:13px}
.sport-ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--moh) 0 68%,rgba(255,255,255,.72) 68%);border:9px solid rgba(255,255,255,.68)}
.sport-ring b{font-family:var(--display);font-size:34px}
.sport-ring span{font-size:10px;color:var(--muted)}
.sport-history{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sport-history>div{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.sport-history i{font-style:normal;font-size:24px}
.sport-history span,.sport-history b,.sport-history small{display:block}
.sport-history small{margin-top:3px;color:var(--muted)}
.trip-line{border-top:1px solid var(--line)}
.trip-stop{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:17px 5px}
.trip-stop:after{content:'→';font-size:18px}
.trip-stop i{font-style:normal;width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#e4edff,#def3ed);display:grid;place-items:center}
.trip-stop span,.trip-stop b,.trip-stop small{display:block}
.trip-stop small{margin-top:4px;color:var(--muted)}
.trip-stop:hover{padding-left:12px;background:linear-gradient(90deg,rgba(94,151,146,.08),transparent)}
.shared-daily{border-radius:34px;background:linear-gradient(135deg,#f2b3c1,#f4d7a2 55%,#a9d4c5);text-align:center;padding:clamp(28px,5vw,50px) 0;padding-bottom:30px!important}
.shared-daily-copy{max-width:720px;margin:auto}
.shared-daily h2{font-family:var(--display);font-size:clamp(30px,5vw,45px);line-height:1.08;margin:7px 0 10px}
.shared-daily-copy p{max-width:570px;margin:auto;color:var(--muted)}
.shared-answer-pair{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;max-width:600px;margin:34px auto 20px}
.shared-answer-pair button{border:0;background:transparent}
.shared-answer-pair button i{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#f29f8d;border:4px solid rgba(255,255,255,.72);font:900 29px var(--display);font-style:normal}
.shared-answer-pair button:last-child i{background:#6ab7b1}
.shared-answer-pair b,.shared-answer-pair span{display:block}
.shared-answer-pair b{font-family:var(--display);font-size:19px;margin-top:7px}
.shared-answer-pair span{font-size:10px;color:var(--muted)}
.shared-answer-link{font-style:normal;font-size:24px}
.shared-open-answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:690px;margin:18px auto}
.shared-open-answers p{padding:15px;border-radius:17px;background:rgba(255,255,255,.68);font-size:13px}
.shared-open-answers b{display:block;margin-bottom:5px}
.shared-locked{font-size:11px;color:var(--muted);margin:16px;padding-top:var(--sp3);margin-top:var(--sp2);border-top:1px solid var(--line-soft)}
.lead-search{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}
.moh-day{display:grid;gap:42px}
.day-chapter{position:relative;padding-left:64px;display:block}
.day-chapter:before{content:"";position:absolute;left:22px;top:48px;bottom:-44px;width:1px;background:linear-gradient(var(--moh),rgba(23,125,146,.08))}
.day-chapter:last-child:before{display:none}
.day-marker{position:absolute;left:0;top:0;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid rgba(23,125,146,.18);box-shadow:var(--shadow2);font-size:20px}
.day-copy{margin-bottom:24px}
.day-copy h2{font:800 clamp(26px,3vw,35px)/1.1 var(--display);margin:3px 0 5px}
.day-copy p{margin:0;color:var(--muted);font-size:13px}
.body-flow{display:grid;gap:12px;padding:0;grid-template-columns:.9fr .72fr 1.38fr!important}
.body-flow .move-card{grid-column:auto;grid-row:auto}
.body-flow .visual-card,.body-flow .push-card{border:0;box-shadow:none;background:rgba(255,255,255,.72)}
.day-surface{border-radius:30px;padding:18px;border:1px solid rgba(23,125,146,.1);margin:0;background:linear-gradient(135deg,var(--mohSoft),var(--mohBlue) 60%,var(--paper))!important}
.today-work-path{padding:4px 20px;display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;gap:var(--sp3)!important}
.today-door{justify-content:space-between;transition:.2s ease;border:0;border-radius:0;text-align:left;min-height:0!important;padding:var(--sp4) var(--sp5)!important;display:flex!important;flex-direction:row!important;align-items:center!important;gap:var(--sp3)!important;background:var(--paper)!important}
.today-door:first-child{background:linear-gradient(145deg,#d9f2ed,#edf8f5)}
.today-door:last-child{background:linear-gradient(145deg,#e1eaff,#f1ecfb)}
.today-door:hover{transform:translateY(-3px);box-shadow:none;background:color-mix(in srgb,var(--soft) 26%,white)}
.today-door i{font-style:normal;flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:19px}
.today-door b{font:600 21px/1.2 var(--serif);font-family:var(--serif)!important;font-size:18px!important;line-height:1.2}
.today-door span{display:block;color:var(--muted);margin-top:6px;font-size:12.5px}
.recharge-ribbon{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.recharge-ribbon::-webkit-scrollbar{display:none}
.recharge-ribbon .recharge{flex:1 0 155px;scroll-snap-align:start;border:0!important;border-radius:22px!important;background:rgba(255,255,255,.76)!important;text-align:left;transition:.2s ease}
.recharge-ribbon .recharge:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.contact-tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none;background:#fffefa}
.contact-tabs::-webkit-scrollbar{display:none}
.contact-tabs button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px;color:var(--muted);font-size:12px;font-weight:800}
.contact-tabs button b{margin-left:7px;color:inherit}
.contact-tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.contact-day-note{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 3px 10px;border-bottom:1px solid var(--line)}
.contact-day-note b,.contact-day-note span{display:block}
.contact-day-note b{font:800 24px var(--display)}
.contact-day-note span{font-size:12px;color:var(--muted);margin-top:3px}
.contact-day-note strong{font-size:11px;color:var(--moh);background:var(--mohSoft);border-radius:999px;padding:8px 10px;white-space:nowrap}
.work-mode-tabs{grid-template-columns:1fr 1fr;margin-bottom:14px;display:flex;gap:26px;border-bottom:1px solid var(--line)}
.work-mode-tabs button{border:0;min-height:0;border-radius:0;background:transparent!important;padding:13px 2px;text-align:left;box-shadow:none!important}
.work-mode-tabs button b,.work-mode-tabs button span{display:block}
.work-mode-tabs button b{font:800 21px var(--display)}
.work-mode-tabs button span{font-size:12px;color:var(--muted);margin-top:5px}
.work-mode-tabs button.on{background:linear-gradient(145deg,#d9f2ed,#dfe9ff);box-shadow:inset 0 0 0 1px rgba(23,125,146,.12);border-bottom:3px solid var(--moh)}
.creative-work-stage{display:grid;grid-template-columns:96px minmax(0,1fr);gap:25px;align-items:center;padding:clamp(23px,4vw,40px);border-radius:42px 12px 42px 12px;background:linear-gradient(125deg,var(--wash-mint),var(--wash-blue) 54%,var(--wash-gold));box-shadow:none;border-top:1px solid var(--line)}
.creative-work-mark{width:82px;height:82px;border-radius:28px;display:grid;place-items:center;font-size:34px;box-shadow:var(--shadow2);background:linear-gradient(145deg,#dff4f1,#e8edfb)}
.creative-work-stage h2{font:800 clamp(27px,4vw,40px)/1.05 var(--display);margin:6px 0 10px}
.creative-work-stage p{max-width:650px;color:var(--muted);line-height:1.55}
.project-thread{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 4px;border-bottom:1px solid var(--line)}
.project-thread span,.project-thread b,.project-thread small{display:block}
.project-thread span,.project-thread small{font-size:11px;color:var(--muted)}
.project-thread b{margin:3px 0}
.work-library{margin-top:15px;border-top:1px solid var(--line);padding-top:15px}
.work-library summary{cursor:pointer;font-weight:850}
.work-library-lines{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.work-library-lines button{border:0;background:#fff;border-radius:16px;padding:12px;text-align:left}
.work-library-lines b,.work-library-lines span{display:block}
.work-library-lines b{font-size:13px}
.work-library-lines span{font-size:10px;color:var(--muted);margin-top:3px}
.shared-choice-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shared-choice{border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px;text-align:left;font-weight:800}
.shared-choice:hover,.shared-choice.on{background:linear-gradient(135deg,#f8dce4,#e1f1ed);border-color:rgba(45,38,55,.12)}
.shared-choice.custom{grid-column:1/-1;text-align:center;background:var(--soft)}
.shared-day-path{padding:clamp(22px,4vw,38px) 0}
.shared-day-intro{max-width:620px;margin-bottom:22px}
.shared-day-intro h2{font:800 clamp(28px,4vw,39px)/1.08 var(--display);margin:5px 0}
.shared-path-line{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.shared-path-line:before{content:"";position:absolute;left:9%;right:9%;top:30px;height:1px;background:linear-gradient(90deg,var(--aya),var(--us2),var(--moh))}
.shared-path-line button{position:relative;border:0;background:transparent;padding:0 8px;text-align:center}
.shared-path-line i{position:relative;z-index:2;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 11px;background:#fff;border:1px solid var(--line);font-style:normal;font-size:23px;box-shadow:var(--shadow2)}
.shared-path-line b,.shared-path-line small{display:block}
.shared-path-line b{font-size:13px}
.shared-path-line small{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}
.home-hierarchy{position:relative;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);box-shadow:var(--shadow3);padding:var(--sp6);max-width:960px}
.home-root-node{max-width:none!important;justify-content:flex-start!important;margin:0 0 22px!important;background:transparent!important;border:0!important;box-shadow:none!important;padding:0 0 var(--sp5) 0!important;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:var(--sp3)}
.home-root-node i{font-style:normal;width:46px;height:46px;border-radius:50%;background:var(--usSoft);display:grid;place-items:center;font-size:20px}
.home-root-node span,.home-root-node b{display:block}
.home-root-node span{font:800 27px var(--display)}
.home-root-node b{font-size:11px;color:var(--muted);margin-top:3px}
.home-tree-line{width:1px;height:28px;background:var(--line);margin:auto;display:none!important}
.home-tree-groups{flex-wrap:wrap;justify-content:flex-start!important;margin-bottom:20px;border:0!important;background:transparent!important;padding:var(--sp4) 0!important;margin:0!important;gap:var(--sp2)!important;display:flex}
.home-tree-groups button{min-height:42px;background:transparent!important;border:1px solid var(--line)!important;border-radius:var(--rpill)!important;padding:9px 16px!important}
.home-tree-groups button b,.home-tree-groups button span{font-size:11px}
.home-tree-groups button span{margin-left:6px;color:var(--muted)}
.home-tree-groups button.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.home-tree-content{display:grid;grid-template-columns:minmax(210px,.7fr) minmax(0,1.3fr);gap:22px;margin-top:25px}
.home-tree-cats{display:grid;align-content:start}
.home-tree-cats button{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 6px;text-align:left}
.home-tree-cats button i{font-style:normal;font-size:20px}

/* Money goals — same conic-ring language already used for Us/Blueprint,
   so the goal that's furthest along visibly leads instead of every row
   reading as an identical thin bar. Pure background-layer trick (no new
   markup): a white "hole" radial-gradient painted on top of the same
   conic-gradient the ring uses elsewhere, so the existing icon/photo
   content just sits on top of it same as before. The thin bar in the
   text column stays too, as a secondary confirmation, not the only cue. */
.money-goal-paths>button>i{width:60px!important;height:60px!important;border-radius:50%!important;display:grid!important;place-items:center;background:radial-gradient(circle,#fff 0 62%,transparent 64% 100%),conic-gradient(var(--us) calc(var(--p,0)*1%),color-mix(in srgb,var(--us) 14%,#fff) 0)!important}
.money-goal-paths>button>i span{width:74%!important;height:74%!important;border-radius:50%!important}
.money-goal-paths>button:first-child>i{width:72px!important;height:72px!important;font-size:27px}

.aya-journey .journey-chapter:nth-child(4):before{background:linear-gradient(110deg,var(--wash-mint),var(--wash-coral))}
.mohamad-journey .journey-chapter:nth-child(1):before{background:linear-gradient(110deg,var(--wash-mint),var(--wash-gold))}

.journey-chapter>*:nth-child(n+3){min-width:0;padding-inline:0;grid-column:3;align-self:start;display:block;margin-left:54px}
.journey-content,.journey-meals,.recharge-live,.me-zone{width:100%;min-width:0}
.task-compose .input{min-width:0;border:0;background:transparent;padding-left:0;box-shadow:none;min-height:42px}
.visual-card,.push-card{min-width:0;padding:14px}
.signal-title{min-width:0}
.shared-playground .shared-scene-head h2{margin-inline:0}
.vault-gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:26px 18px;overflow:auto;background:radial-gradient(circle at 10% 10%,color-mix(in srgb,var(--ayaLilac) 70%,transparent) 0,transparent 34%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--mohSoft) 70%,transparent) 0,transparent 36%),var(--bg)}

.vault-note{font-size:12px!important;margin-top:16px!important}

.section-head h2,.journey-copy h2{line-height:1.12;font-size:29px}
.signal-title h3,.today-door b,.home-inline-head h2{font-size:21px}
.content p,.task b,.meal-copy b{overflow-wrap:break-word}

.journey-chapter .me-zone>.eyebrow,.journey-chapter .me-zone>h2,.journey-chapter .me-zone>p{display:none}

.signin-profile{border:1px solid var(--line);border-radius:20px;background:#fff;padding:15px;text-align:left}
.signin-profile i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);font-style:normal;margin-bottom:9px}

.account-setup .input{margin-top:8px}

.signed-in-line i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;font:800 18px var(--display);font-style:normal}

.signed-in-line span{font-size:12px;color:var(--muted)}
.session-badge{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:12px;font-weight:800}

.task-author{color:var(--accent);font-weight:800}
.first-setup-card{width:min(680px,100%)}

.section-head p,.journey-copy p{font-size:13px}

.auth-card{margin:auto;color:#252139;width:min(520px,100%);border-radius:28px;padding:38px;background:rgba(255,255,255,.94);border:1px solid rgba(23,24,37,.08);box-shadow:0 28px 90px rgba(23,24,37,.11)}

.password-field{position:relative}

.auth-create-card section{padding:0;border:0;background:transparent}

.display,.brand b,.page-head h1,.section-head h2,.journey-copy h2,.portal h2,.auth-card h1{font-family:var(--display)}

button,a,input,select,textarea{transition:border-color .18s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}

/* ============================================================
   NEW — consolidated foundation additions (single source, no !important wars)
   Bento hierarchy, empty-state warmth, and broad microinteractions.
   ============================================================ */

/* Empty states: one soft icon-led voice instead of a bare dashed box */
.empty{position:relative;padding:32px 20px;border:1px solid var(--line);border-radius:var(--r2);background:linear-gradient(145deg,color-mix(in srgb,var(--soft) 55%,white),var(--paper));color:var(--muted);text-align:center}
.empty:before{content:"\2726";display:block;font-size:22px;margin-bottom:8px;color:var(--accent)}

/* Bento hierarchy: the first tile in a repeat(4,1fr)-style row gets more presence,
   so equal-sized grids stop reading as a wall of identical boxes. Safe fallback:
   with fewer than 2 items the span simply narrows the row, nothing breaks. */
.lead-kpis .kpi:first-child,.spacegrid .spacecard:first-child,.future-grid .future-card:first-child,
.house-cats .housecat:first-child,.brief .brief-cell:first-child,.review-stats .review-stat:first-child,
.work-entrances .work-entry:first-child,.wish-grid .wish:first-child,.recharge-strip .recharge:first-child,
.scenegrid .scene:first-child{grid-column:span 2}
.lead-kpis .kpi:first-child b,.review-stats .review-stat:first-child b{font-size:1.28em}
.spacegrid .spacecard:first-child .spacevisual,.wish-grid .wish:first-child .wish-photo{aspect-ratio:2.4/1}

/* Microinteractions: consistent hover-lift + press-scale across every tappable
   surface. Respects prefers-reduced-motion via the existing global rule above. */
button,.portal,.panel,.visual-card,.category-card,.area-row,.scene,.leadrow,.kpi,.daycol,
.spacecard,.wish,.future-card,.housecat,.work-entry,.chip,.choice,.moh-card,.push-card,
.stat-card,.recharge,.feeling,.vibe,.need,.phase,.media-tab,.review-day,.mile{transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
button:not(:disabled):hover,.portal:hover,.panel:hover,.wish:hover,.future-card:hover,.housecat:hover,
.work-entry:hover,.scene:hover,.spacecard:hover,.moh-card:hover,.stat-card:hover{transform:translateY(-2px)}
button:not(:disabled):active,.chip:active,.choice:active,.feeling:active{transform:scale(.97)}

/* ============================================================
   Redesign pass — Sept 2026. One consolidated layer, documented,
   appended last on purpose (source order = it wins over earlier
   rules without needing a new !important war). Nothing above this
   line was touched. See notes at each block for what problem it
   answers.
   ============================================================ */

/* 1) Empty states — every "nothing here yet" gets a small icon and
   warmer surface instead of a flat dashed box, app-wide. */
.empty{position:relative;padding-top:44px!important}
.empty:before{content:'✦';position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:19px;color:var(--accent);opacity:.55}
.home-inline-empty{background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--cat,var(--us)) 16%,#fff))!important}
.home-empty-icon{display:block;font-size:24px;margin-bottom:8px;opacity:.75}

/* 2) Future Home — each category carries its own accent (icon,
   active state, subcategory tabs, saved-item bullets, the "choose
   a smaller area" band) instead of one flat lilac everywhere. */
.home-inline-cats button{background:color-mix(in srgb,var(--cat,var(--us)) 10%,#fff)!important;border:1.5px solid color-mix(in srgb,var(--cat,var(--us)) 26%,var(--line))!important;color:var(--ink)!important;border-radius:14px!important;transition:transform .15s var(--ease)}
.home-inline-cats button:hover{transform:translateY(-2px)}
.home-inline-cats button.on{background:var(--cat,var(--us))!important;border-color:var(--cat,var(--us))!important;color:#fff!important;box-shadow:0 8px 20px color-mix(in srgb,var(--cat,var(--us)) 35%,transparent)!important}
.home-inline-subs button.on{background:var(--cat,var(--us))!important;border-color:var(--cat,var(--us))!important;color:#fff!important}
.home-inline-item i{background:color-mix(in srgb,var(--cat,var(--us)) 16%,#fff)!important;color:color-mix(in srgb,var(--cat,var(--us)) 65%,#241f2e)}
.future-persistent-action{border-bottom-color:color-mix(in srgb,var(--cat,var(--us)) 40%,var(--line-soft))!important}

/* 3) Meals — each slot gets its own icon + warmth instead of an
   identical grey square and the same "Add meal" four times
   (copy differentiation happens in JS; this is the visual half). */
.meal[data-slot="Breakfast"] .meal-thumb{background:linear-gradient(145deg,var(--sun),var(--peach))!important}
.meal[data-slot="Lunch"] .meal-thumb{background:linear-gradient(145deg,var(--us3),var(--mint))!important}
.meal[data-slot="Dinner"] .meal-thumb{background:linear-gradient(145deg,var(--lilac),var(--aya2))!important}
.meal[data-slot="Snack"] .meal-thumb{background:linear-gradient(145deg,var(--mint),var(--moh3))!important}

/* 4) Today pages (Aya / Mohamad) — real bento hierarchy: the first
   chapter (what you're starting the day with) and the last one
   (winding down) run full width as anchors; the chapters between
   them sit two-up instead of one long column of identical blocks.
   Each chapter also gets a visible top accent in its own
   --chapter-color instead of relying on a small marker circle alone. */
.life-journey{display:block!important;counter-reset:planner-step}
.journey-chapter{margin-bottom:0!important;border-top:4px solid var(--chapter-color,var(--pink))!important}
.journey-chapter:first-child,.journey-chapter:last-child{grid-column:1/-1!important}
@media (max-width:820px){.life-journey{grid-template-columns:1fr!important}.journey-chapter{grid-column:1/-1!important}}

/* 5) Us / "Keep what matters" — the dotted ring reads as a real
   connective device (dashed, colored) instead of a faint outline,
   and each action gets its own color so the four feel distinct:
   kindness=rose, memory=gold, home=violet-teal, money=green. */
.shared-constellation:before{border:2px dashed color-mix(in srgb,var(--us) 50%,transparent)!important;opacity:1!important}
.shared-constellation-center{box-shadow:0 0 0 7px color-mix(in srgb,var(--us) 12%,transparent),0 18px 50px rgba(91,58,76,.16)!important}
.shared-constellation button:nth-of-type(1) i{background:color-mix(in srgb,var(--aya) 22%,#fff)!important;color:var(--aya)}
.shared-constellation button:nth-of-type(2) i{background:color-mix(in srgb,var(--gold) 24%,#fff)!important;color:var(--gold)}
.shared-constellation button:nth-of-type(3) i{background:color-mix(in srgb,var(--moh2) 22%,#fff)!important;color:var(--moh2)}

/* ============================================================
   Redesign pass 2 — Sept 2026 (feedback round). Appended last,
   same discipline as pass 1.
   ============================================================ */

/* 6) Background — Aya's own space had NO personalized background
   rule at all (only Mohamad and Together did — a real gap, not a
   style choice), which is a real reason her most-used page read
   flatter than the other two. All three now carry a genuine tinted
   wash in their own color family, and it's stronger everywhere so
   the page itself holds color instead of only the cards floating
   on plain cream. */
body[data-space="aya"]{--accent:var(--aya);--accent2:var(--aya2);--soft:var(--ayaSoft);background:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--aya) 20%,transparent),transparent 32%),radial-gradient(circle at 94% 12%,color-mix(in srgb,var(--aya2) 17%,transparent),transparent 30%),radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--aya3) 11%,transparent),transparent 42%),var(--bg)!important}
body[data-space="mohamad"]{background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--moh) 20%,transparent),transparent 32%),radial-gradient(circle at 92% 10%,color-mix(in srgb,var(--moh2) 17%,transparent),transparent 30%),radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--moh3) 12%,transparent),transparent 42%),var(--bg)!important}
body[data-space="together"]{background:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--us) 20%,transparent),transparent 32%),radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--us2) 17%,transparent),transparent 30%),radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--us3) 11%,transparent),transparent 42%),var(--bg)!important}

/* 7) Mohamad's push-up counter — a first, contained taste of the
   game-like framing (levels, a fill bar) that fits how he already
   thinks, without inventing any new data: it's the same counter,
   read as a level instead of a bare number. */
.push-level-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.push-level-badge{font:800 11px var(--sans);letter-spacing:.03em;background:linear-gradient(135deg,var(--moh),var(--moh2));color:#fff;padding:4px 9px;border-radius:999px;flex:none}
.push-level-track{flex:1;height:6px;border-radius:99px;background:var(--mohSoft);overflow:hidden}
.push-level-track i{display:block;height:100%;background:linear-gradient(90deg,var(--moh),var(--moh3));border-radius:99px;transition:width .3s var(--ease)}
.push-xp{font-size:10.5px;color:var(--muted);flex:none;white-space:nowrap}

/* 8) Memories — a small tilted "polaroid" treatment, scoped to
   .memory-card only (never the shared .wish class used by Future Home,
   which stays flat/serious for real purchase decisions). Alternating
   tilt per card via the --tilt custom property set inline; hover
   straightens the card, which is the one bit of motion this page gets. */
.memory-card{transform:rotate(var(--tilt,0deg));border:1px solid var(--line-soft)!important;box-shadow:0 10px 26px rgba(36,31,46,.10)!important;background:#fff!important;padding:8px 8px 4px!important;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.memory-card:hover{transform:rotate(0deg) translateY(-3px);box-shadow:0 16px 34px rgba(36,31,46,.14)!important;z-index:2}
.memory-card .wish-photo{border-radius:12px}
.memory-card .wish-copy{padding:10px 4px 4px}

/* 9) Creative Work Studio — the "today's idea" mark (◉ / ↗) already sat
   in a soft pastel container, same weight as everything else on the
   page. Since this literally is today's one action, it gets the same
   "one bold moment" treatment as the Us/Money rings: solid saturated
   fill instead of a pastel tint, so the eye lands there first. */
.creative-work-mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--moh),var(--moh2));color:#fff;font-size:22px;flex:none;box-shadow:0 10px 22px color-mix(in srgb,var(--moh) 30%,transparent)}

  box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
  transition: transform 0.5s ease;
  position: relative;
}

.breathing-orb.active {
  animation: breathPulse 19s infinite ease-in-out;
}

@keyframes breathPulse {
  0% { transform: scale(1); box-shadow: 0 0 12px rgba(16, 185, 129, 0.2); }
  21% { transform: scale(1.45); box-shadow: 0 0 28px rgba(16, 185, 129, 0.6); } /* Inhale 4s (4/19 = 21%) */
  58% { transform: scale(1.45); box-shadow: 0 0 28px rgba(16, 185, 129, 0.6); } /* Hold 7s (11/19 = 58%) */
  100% { transform: scale(1); box-shadow: 0 0 12px rgba(16, 185, 129, 0.2); } /* Exhale 8s (19/19 = 100%) */
}

async function fileData(id){const input=$('#'+id),f=input?.files?.[0];if(!f)return'';const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(!f.type.startsWith('image/'))return raw;return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>resolve(raw);img.src=raw})}

   LIVING AUDIO & INTERACTION ENGINE (Zero External Assets)

let __audioCtx = null;
function getAudioContext() {
  try {
    if (!__audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) __audioCtx = new AudioCtx();
    }
    if (__audioCtx && __audioCtx.state === 'suspended') {
      __audioCtx.resume();
    }
  } catch (e) {
    console.warn('AudioContext init note:', e);
  }
  return __audioCtx;
}

// Gentle pleasant chimes (Love tap, water, spark)
function playGentleSound(type) {
  const ctx = getAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;

  if (type === 'love') {
    // 4-note acoustic bell chord (C5, E5, G5, C6)
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.07);
      gain.gain.setValueAtTime(0.09, now + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.07 + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + idx * 0.07);
      osc.stop(now + idx * 0.07 + 0.55);
    });
  } else if (type === 'water') {
    // Water droplet pop (frequency glide)
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(840, now + 0.09);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.14);
  } else if (type === 'spark') {
    // Power spark for pushups
    [440, 554.37, 659.25].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.05);
      gain.gain.setValueAtTime(0.08, now + idx * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + idx * 0.05);
      osc.stop(now + idx * 0.05 + 0.45);
    });
  }
}

// Ambient Soundscapes Synthesizer Engine
let __ambientNodes = null;
window.__activeSoundscape = null;

function toggleAmbientSound(name) {
  const ctx = getAudioContext();
  if (!ctx) return toast('Audio not supported on this device');

  if (window.__activeSoundscape === name) {
    stopAmbientSound();
    window.__activeSoundscape = null;
    render(true);
    return;
  }

  stopAmbientSound();
  window.__activeSoundscape = name;

  try {
    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = ctx.createBiquadFilter();
    const gainNode = ctx.createGain();

    if (name === 'rain') {
      filter.type = 'lowpass';
      filter.frequency.value = 850;
      gainNode.gain.value = 0.055;
    } else if (name === 'cafe') {
      filter.type = 'bandpass';
      filter.frequency.value = 600;
      filter.Q.value = 1.2;
      gainNode.gain.value = 0.06;
    } else if (name === 'hearth') {
      filter.type = 'lowpass';
      filter.frequency.value = 450;
      gainNode.gain.value = 0.07;
    } else if (name === 'night') {
      filter.type = 'highpass';
      filter.frequency.value = 2200;
      gainNode.gain.value = 0.025;
    }

    whiteNoise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(ctx.destination);

    whiteNoise.start();
    __ambientNodes = { source: whiteNoise, gain: gainNode };
    toast(`Playing ambient: ${name}`);
  } catch (e) {
    console.error('Ambient audio error:', e);
  }

  render(true);
}

function stopAmbientSound() {
  if (__ambientNodes) {
    try {
      __ambientNodes.source.stop();
      __ambientNodes.source.disconnect();
    } catch(e) {}
    __ambientNodes = null;
  }
}

function triggerFloatingHearts(btnEl) {

  const originY = rect.top;

  const emojis = ['♡', '✨', '🌸', '💖', '🤍'];
  for (let i = 0; i < 12; i++) {

/* ==========================================================================

   ========================================================================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;

  if (a === 'quick-love-tap') {
    triggerFloatingHearts(b);
    sendLoveTap(b.dataset.owner || 'aya', b.dataset.text || 'Thinking of you ♡');
    return;
  }

  if (a === 'water-plus-animated') {
    const owner = b.dataset.owner || 'aya';
    state[owner].water = (state[owner].water || 0) + 1;
    save();
    playGentleSound('water');
    preserveRender();
    return;
  }

  if (a === 'water-boost-bottle') {
    const owner = b.dataset.owner || 'aya';
    state[owner].water = (state[owner].water || 0) + 2;
    save();
    playGentleSound('water');
    toast('+500ml added to your flow 🌊');
    preserveRender();
    return;
  }

  if (a === 'pushups-spark') {
    const delta = Number(b.dataset.delta || 5);
    state.mohamad.pushups = Math.max(0, (state.mohamad.pushups || 0) + delta);
    save();
    playGentleSound('spark');
    toast(`+${delta} Push-ups logged! 💪`);
    preserveRender();
    return;
  }

  if (a === 'move-toggle') {
    const owner = b.dataset.owner;
    const move = b.dataset.move;
    state[owner].move = state[owner].move || [];
    if (state[owner].move.includes(move)) {
      state[owner].move = state[owner].move.filter(x => x !== move);
    } else {
      state[owner].move.push(move);
      playGentleSound('spark');
    }
    save();
    preserveRender();
    return;
  }

  if (a === 'toggle-breathing') {
    window.__breathingActive = !window.__breathingActive;
    preserveRender();
    return;
  }

  if (a === 'toggle-ambient') {
    toggleAmbientSound(b.dataset.sound);
    return;
  }

  if (a === 'vibe-invite-partner') {
    const kind = b.dataset.kind;
    const idea = b.dataset.idea;
    const currentMember = state.meta.currentMember || 'aya';
    sendLoveTap(currentMember, `Let's do this tonight: ${idea.split(' · ')[0]} (${kind}) 🕯️`);

function timeAgo(isoString) {
  if (!isoString) return '';
  try {
    const diff = Date.now() - new Date(isoString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  } catch (e) {
    return '';
  }
}

function formatChronicleDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  } catch (e) {
    return dateStr;
  }
}

function getRelationshipStats() {
  state.together = state.together || {};
  const ann = state.together.anniversary;
  // SAFEGUARD: Do not use fake default 2024-01-01 unless explicitly confirmed/customized by the user
  if (!ann || (ann === '2024-01-01' && !state.together.anniversaryCustomized)) {
    return { isSet: false, days: null, dateStr: '', formattedDate: '' };
  }
  try {
    const start = new Date(ann + 'T00:00:00');
    if (isNaN(start.getTime())) return { isSet: false, days: null, dateStr: '', formattedDate: '' };
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const diffDays = Math.floor((now.getTime() - start.getTime()) / (1000 * 60 * 60 * 24));
    return {
      isSet: true,
      days: Math.max(0, diffDays),
      dateStr: ann,
      formattedDate: start.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
    };
  } catch (e) {
    return { isSet: false, days: null, dateStr: '', formattedDate: '' };
  }
}

function calculateDaysInLove() {
  const stats = getRelationshipStats();
  return stats.isSet ? stats.days : null;
}

function getCountdowns() {
  state.together = state.together || {};
  let list = state.together.countdowns || [];
  // Migrate legacy countdown if present
  if (state.together.countdown && state.together.countdown.date) {
    const exists = list.some(c => c.date === state.together.countdown.date);
    if (!exists) {
      list.unshift({
        id: 'cd_' + Date.now(),
        title: state.together.countdown.label || 'Our Milestone',
        date: state.together.countdown.date,
        icon: state.together.countdown.icon || '✨',
        category: 'Milestone'
      });
      state.together.countdowns = list;
    }
  }
  return list;
}

function getCountdownDiff(dateStr) {
  if (!dateStr) return null;
  try {
    const target = new Date(dateStr + 'T00:00:00');
    if (isNaN(target.getTime())) return null;
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.ceil((target.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
  } catch (e) {
    return null;
  }
}

  if (a === 'delete-sticky') {
    const id = b.dataset.id;
    state.together.stickyNotes = (state.together.stickyNotes || []).filter(n => n.id !== id);

  // 7. Milestones Actions
  if (a === 'toggle-dream') {

    const id = b.dataset.id;

});

// 13. Voice Recording Implementation (Real MediaRecorder with safe simulation fallback)
async function startVoiceRecording(owner) {
  _currentRecordingOwner = owner;
  const container = document.getElementById(`recControls_${owner}`);
  if (container) {
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fee2e2;border-radius:12px">
        <span class="rec-btn-pulse" style="font-size:12.5px;font-weight:700;color:#dc2626;display:flex;align-items:center;gap:6px">
          ● Recording... <span id="recTimerDisplay">00:00</span>
        </span>
        <button class="primary" data-action="voice-record-stop" style="background:#dc2626;padding:6px 14px;border-radius:999px;font-size:12px">
          ⏹ Stop & Seal
        </button>
      </div>
    `;
  }

  _recordingSeconds = 0;
  if (_recordingTimer) clearInterval(_recordingTimer);
  _recordingTimer = setInterval(() => {
    _recordingSeconds++;
    const timerDisplay = document.getElementById('recTimerDisplay');
    if (timerDisplay) {
      const mins = String(Math.floor(_recordingSeconds / 60)).padStart(2, '0');
      const secs = String(_recordingSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }
  }, 1000);

  // Attempt real browser mic recording
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      _audioChunks = [];
      _activeMediaRecorder = new MediaRecorder(stream);
      _activeMediaRecorder.ondataavailable = e => _audioChunks.push(e.data);
      _activeMediaRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        let audioUrl = '';
        if (_audioChunks.length > 0) {
          const blob = new Blob(_audioChunks, { type: 'audio/webm' });
          audioUrl = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(blob);
          });
        }
        finishVoiceRecording(owner, audioUrl, _recordingSeconds);
      };
      _activeMediaRecorder.start();
      return;
    }
  } catch (err) {
    console.log('Mic recording unavailable, using synthesized audio fallback:', err);
  }
}

function stopVoiceRecording() {
  if (_recordingTimer) {
    clearInterval(_recordingTimer);
    _recordingTimer = null;
  }
  if (_activeMediaRecorder && _activeMediaRecorder.state !== 'inactive') {
    _activeMediaRecorder.stop();
  } else {
    // Fallback: Generate pleasant audio chime
    finishVoiceRecording(_currentRecordingOwner, generateChimeAudioDataUrl(), Math.max(3, _recordingSeconds));
  }
}

function finishVoiceRecording(owner, audioUrl, seconds) {
  const durationStr = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  state.together.voiceCapsules = state.together.voiceCapsules || {};
  state.together.voiceCapsules[owner] = {
    audioUrl: audioUrl || generateChimeAudioDataUrl(),
    duration: durationStr,
    timestamp: 'Just now'
  };
  save();
  preserveRender();

  const other = owner === 'aya' ? 'mohamad' : 'aya';
  if (state.together.voiceCapsules[other]) {
    toast('🎉 Both recorded! The voice capsule has unlocked ♡');
  } else {
    toast(`🔒 ${owner === 'aya' ? 'Aya' : 'Mohammad'}’s note sealed! Waiting for ${owner === 'aya' ? 'Mohammad' : 'Aya'}.`);
  }
}

// Generate simple pleasant sine wave audio as data URL fallback
function generateChimeAudioDataUrl() {
  // 1-second gentle audio tone
  return "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
}

// Safe robust save override: Never fails, persists to localStorage, never shows spurious encryption error toasts
save = function() {
  state.meta = state.meta || {};
  state.meta.schemaVersion = APP_SCHEMA_VERSION;
  state.meta.updatedAt = now();
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('LocalStorage save failed', err);
  }
  if (vaultCryptoKey && typeof vaultCryptoKey === 'object' && vaultCryptoKey.algorithm && vaultEnvelope) {
    writeEncryptedState().catch(e => console.warn('Encrypted write skipped', e));
  }
  return true;
};
