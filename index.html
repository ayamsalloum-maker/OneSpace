class="plan-label">shower</text><text x="${x+rw*.58}" y="${y+rh*.65}" class="plan-label">vanity</text>`}else if(space==='TV Unit'){f=`<rect x="${x+rw*.10}" y="${y+rh*.20}" width="${rw*.80}" height="${rh*.60}" rx="5" class="plan-furn"/><rect x="${x+rw*.34}" y="${y+rh*.30}" width="${rw*.32}" height="${rh*.28}" rx="3" class="plan-tv"/><text x="${x+rw*.41}" y="${y+rh*.47}" fill="#fff" font-size="12" font-weight="800">TV zone</text>`}else{f=`<rect x="${x+rw*.10}" y="${y+rh*.22}" width="${rw*.24}" height="${rh*.50}" rx="20" class="plan-furn"/><rect x="${x+rw*.62}" y="${y+rh*.46}" width="${rw*.28}" height="${rh*.22}" rx="6" class="plan-furn2"/><text x="${x+rw*.66}" y="${y+rh*.59}" class="plan-label">storage</text>`}return `<div class="practice-plan"><div class="eyebrow" style="margin-bottom:7px">Scaled schematic plan · practice only</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scaled schematic room plan"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" class="plan-wall"/><line x1="${x+(rw-win)/2}" y1="${y}" x2="${x+(rw+win)/2}" y2="${y}" class="plan-window"/><text x="${x+rw/2-32}" y="${y-12}" class="plan-label">window</text><path d="M ${x} ${y+rh-door} L ${x+door} ${y+rh-door} A ${door} ${door} 0 0 0 ${x} ${y+rh}" class="plan-door"/><text x="${x+8}" y="${y+rh-door-8}" class="plan-label">door</text>${f}<line x1="${x}" y1="${y+rh+20}" x2="${x+rw}" y2="${y+rh+20}" stroke="#8c8290" stroke-width="1"/><text x="${x+rw/2-36}" y="${y+rh+39}" class="plan-dim">Width ${b.w.toFixed(1)} m</text><text x="${Math.max(18,x-35)}" y="${y+rh/2}" class="plan-dim" transform="rotate(-90 ${Math.max(18,x-35)} ${y+rh/2})">Length ${b.l.toFixed(1)} m</text></svg></div>`}
function ceilingSvg(space,b){const g=CEILING_GUIDE[space]||CEILING_GUIDE.Bedroom,W=520,H=320,maxW=360,maxH=210,scale=Math.min(maxW/b.w,maxH/b.l),rw=b.w*scale,rh=b.l*scale,x=(W-rw)/2,y=55+(maxH-rh)/2;const pts=space==='Kitchen'?[[.22,.28],[.50,.28],[.78,.28],[.22,.72],[.50,.72],[.78,.72]]:space==='Bathroom'?[[.30,.30],[.70,.30],[.50,.72]]:[[.28,.30],[.72,.30],[.28,.72],[.72,.72]];return `<div class="ceiling-card"><div class="eyebrow">Reflected ceiling concept · practice</div><h4>${esc(g.title)}</h4><p class="tiny muted">Practice ceiling height: ${practiceHeight(space,b).toFixed(1)} m. Design assumption only — not a site measurement or electrical drawing.</p><div class="ceiling-plan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conceptual reflected ceiling plan"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="4" class="ceiling-line"/>${pts.map(([px,py])=>`<circle cx="${x+rw*px}" cy="${y+rh*py}" r="12" class="ceiling-light"/><circle cx="${x+rw*px}" cy="${y+rh*py}" r="4" fill="#fff"/>`).join('')}<path d="M ${x+rw*.10} ${y+rh*.86} H ${x+rw*.90}" class="ceiling-strip"/><text x="${x}" y="${y+rh+28}" class="ceiling-note">${esc(g.lights[0])}</text><text x="${x}" y="${y+rh+44}" class="ceiling-note">${esc(g.lights[1]||'')}</text></svg></div></div>`}
function renderInteriorScene(space,scene){const base=INTERIOR[space]?.scenes?.[scene];if(!base)return renderInteriorSpace(space);const phase=(new URLSearchParams(location.hash.split('?')[1]||'')).get('phase')||'Look',saved=state.aya.interior?.[space]?.[scene]||{},project=saved.project||{},b={...base,w:Number(project.w)||base.w,l:Number(project.l)||base.l,h:Number(project.h)||base.h,brief:project.brief||base.brief},works=saved.work||[],cg=CEILING_GUIDE[space]||CEILING_GUIDE.Bedroom,title=project.title||scene;return shell('aya','aya/grow',`${pageHead(title,`${space} · ${project.title?'real project workspace':'project template'}`)}<div class="panel soft"><div class="between"><div><div class="eyebrow">Project brief</div><h3 class="display" style="font-size:27px;margin:4px 0">${project.title?'Measured conditions for this project':'Start with the template or enter real site measurements'}</h3></div><button class="chip" data-action="interior-brief" data-space="${esc(space)}" data-scene="${esc(scene)}">${project.title?'Edit real brief':'+ Use real project'}</button></div><div class="brief" style="margin-top:12px"><div class="brief-cell"><span>Width</span><b>${b.w.toFixed(1)} m</b></div><div class="brief-cell"><span>Length</span><b>${b.l.toFixed(1)} m</b></div><div class="brief-cell"><span>Ceiling</span><b>${practiceHeight(space,b).toFixed(1)} m</b></div></div><div class="grid2" style="margin-top:12px"><div><p class="small" style="margin:0 0 7px"><b>Client / use</b><br>${esc(b.brief)}</p></div><div><p class="small" style="margin:0"><b>Main challenge</b><br>${esc(b.challenge)}</p></div></div><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:850;font-size:13px">Site conditions to verify</summary><div class="bank-section" style="margin-top:8px">${b.fixed.map(x=>`<div class="bank-row"><div><b>${esc(x)}</b></div></div>`).join('')}</div></details><div class="project-drawings">${planSvg(space,scene,b)}${ceilingSvg(space,b)}</div><div class="project-cues"><div class="project-cue"><div class="eyebrow">Ceiling intent</div><h4>${esc(cg.title)}</h4><p>${esc(cg.lights.join(' · '))}</p></div><div class="project-cue"><div class="eyebrow">Wall / elevation focus</div><h4>Develop one vertical story</h4><p>${esc(cg.wall)}</p></div><div class="project-cue"><div class="eyebrow">Real-project habit</div><h4>Check before styling</h4><p>Verify circulation, furniture depth, openings and service constraints before choosing finishes.</p></div></div></div><section class="section" id="interior-phase-zone"><div class="phasebar">${INTERIOR_PHASES.map(p=>`<button class="phase ${phase===p?'on':''}" data-action="interior-phase" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${esc(p)}">${p}</button>`).join('')}</div><div class="panel"><div class="between"><div><div class="eyebrow">${esc(phase)}</div><h3 class="display" style="font-size:26px;margin:3px 0">One phase at a time</h3></div><button class="secondary" data-action="interior-upload" data-space="${esc(space)}" data-scene="${esc(scene)}">+ Work image</button></div><div class="bank-section">${INTERIOR_TASKS[phase].map(([t,d],i)=>{const done=saved[phase]?.includes(i);return `<div class="bank-row"><div><b>${done?'✓ ':''}${esc(t)}</b><p>${esc(d)}</p></div><div class="row"><button class="softbtn" data-action="interior-today" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${phase}" data-index="${i}">+ Today</button><button class="secondary" data-action="interior-done" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${phase}" data-index="${i}">${done?'Undo':'Done'}</button></div></div>`}).join('')}</div></div></section><section class="section">${sectionHead('Work gallery','Sketches, measured plans, boards and final work stay attached to this project.')}<div class="workgallery">${works.map(w=>`<div class="workshot" style="background-image:url('${w.src}')"><span>${esc(w.label||'work')}</span></div>`).join('')}<button class="workshot" data-action function incomeGuide(path,title,detail){
 const common={
  'Choose one skill you can deliver now':['Pick ONE thing to test for the next 2 weeks — not your forever career.','Try one of these starting points: content/social support from existing assets · Arabic/English translation/editing · presentation/design support · simple operations/admin support. Write exactly what you would deliver.'],
  'Choose one buyer':['Make the buyer specific enough that you could find 10 of them today.','Instead of “businesses”, write something like: small interior studios in Lebanon that finish good projects but do not turn them into consistent content.'],
  'Define one small problem':['Write the annoying moment the buyer already experiences — no solution yet.','Formula: “When ___ happens, they struggle to ___, which costs them ___.”'],
  'Write the one-sentence offer':['Turn buyer + problem + deliverable into one normal sentence.','Example: “I help small interior studios turn finished projects into a ready-to-post content pack.”'],
  'Choose a pilot price':['Pick a test price you can actually say out loud to a real buyer.','Write the price + what is included. The goal is to test a reaction, not discover the perfect lifetime price.'],
  'Choose one repeated problem':['Start from something you already organize, explain or solve repeatedly.','Write 3 repeated problems, then choose the one that is frequent + specific + annoying enough that someone already looks for a workaround.'],
  'Choose one narrow buyer':['Choose the person with the strongest version of the problem.','Write: role/life situation + context + what they are trying to get done.'],
  'Make the smallest useful version':['Build only the smallest artifact that produces one useful outcome.','Example: not a 70-page planner; a focused weekly planning pack that solves one recurring planning problem.'],
  'Name the first user':['Describe the first user by situation, not age/gender alone.','For OneSpace: someone juggling personal life + work + shared responsibilities who currently keeps things across notes, WhatsApp, memory and separate apps.'],
  'Describe the painful moment':['Describe WHEN the problem becomes painful.','Example: “I know what I want long-term, but every morning I still have to decide from zero what matters today.”'],
  'List current alternatives':['List what they really use now, even if it is messy.','Notes · WhatsApp to self/partner · calendar · Notion · paper planner · memory · separate habit/finance apps.'],
  'Choose one core promise':['Choose the change the user should feel — not a feature list.','Example: “I do not have to hold everything in my head, and the next useful move is easier to see.”'],
  'Test one workflow outside Aya/Mohamad':['Give ONE workflow to a real outside user and watch silently.','Set a task like: add something to today, find a growth move, or save something for the future home. Note every hesitation before explaining.'],
  'Write every friction point':['Record behavior, not opinions only.','Write: where they paused · what they expected · what happened · severity · possible cause.'],
  'Ask a value interview':['Ask about the useful moment, alternatives and return behavior.','Use: What would you come back for? What would this replace? What felt unnecessary? What would you be annoyed to lose?'],
  'Test willingness to pay':['Move from compliments to a concrete commercial signal.','Show a realistic offer/price and ask what they would do next: pay · join waitlist with deposit · book demo · decline and why.'],
  'Cut one weak feature':['Remove or hide one thing that does not strengthen the core loop.','Write what you are removing, what evidence made it weak, and what becomes clearer without it.'],
  'Improve the core loop':['Choose ONE friction in Context → Move → Outcome → Memory → Better next move.','Rewrite the before/after flow and test only that change.'],
  'Write the monthly decision':['Summarize evidence, not feelings.','Keep · Improve · Remove · Test next · price hypothesis. Add the evidence that caused each decision.'],
  'Define the exact deliverable':['Write exactly what the buyer receives and what is NOT included.','Example: 4 feed posts + 6 Story frames + captions, delivered in 5 days, using the client’s existing photos; 1 revision round.'],
  'Make one sample':['Build a believable sample of the final deliverable before selling.','Use a real-looking example: one content pack, one translated page, one presentation board, or one organized workflow — not a moodboard about the service.'],
  'Show it to 3 real people':['Show the sample to people close to the buyer profile and ask specific questions.','Ask: What is clear? What feels useful? What would you change? Would this save you time/money? What would stop you from paying?'],
  'Make one direct offer':['Send the offer to one person who plausibly has the problem.','Message structure: context → problem you can help with → exact deliverable → pilot price / next step. No long pitch.'],
  'Record the signal':['Save what actually happened instead of “they seemed interested”.','Use: no reply · replied but no need · asked questions · asked price · wants to try · paid. Add exact words when useful.'],
  'Improve one thing':['Change only the weakest part shown by evidence.','If people understand it but reject price, test price/scope. If they do not understand it, fix message. If they do not care, revisit the problem/buyer.'],
  'Repeat with 5 better-fit people':['Run the same improved test with a better-fit group before redesigning the offer again.','Keep the core offer stable enough that you can compare responses.'],
  'Find 10 existing paid alternatives':['Search for products people already pay for that solve the same job.','Capture name · price · buyer · promised outcome · format · reviews/complaints. You are mapping demand, not copying design.'],
  'Capture the gap':['Turn competitor/review observations into one testable gap.','Example: existing planners are beautiful but generic; users still have to translate long-term goals into today’s actions themselves.'],
  'Write the outcome':['Describe the change after use, not the file format.','“Know what to do this week without rebuilding the plan from zero” is stronger than “a 25-page PDF planner.”'],
  'Create a realistic mockup':['Show the product close enough to reality that someone can react to it.','Use 3–5 screens/pages that demonstrate the core outcome and what they receive.'],
  'Show it to 5 target people':['Watch them react/use it; do not only ask if they like it.','Record what they open first, ignore, misunderstand, want added, and whether they ask how to get it.'],
  'Pick a test price':['Choose a price hypothesis based on alternatives + value + scope.','Save one primary price and one reason. Do not create 6 tiers before the first sale.'],
  'Create one simple sales page':['Create only what someone needs to decide.','Problem → outcome → what is included → proof/mockup → price → one CTA.'],
  'Try to get one real transaction':['Ask for a real behavior with friction.','Payment is strongest; a deposit, paid pilot, or clear checkout attempt is stronger than “I would buy this.”'],
  'Decide: keep / improve / stop':['Compare your success threshold with what happened.','Write the evidence for the decision. “I still like the idea” is not evidence.'],
  'Only then expand':['Expand only the part proven useful.','Bundle, automate, add versions, or improve design after you know which outcome people value.'],
  'Test again with a new person':['Repeat the same core test with someone who did not watch you build it.','If the product only works when you explain it live, the experience still has a clarity problem.']
 };
 const g=common[title]||['Do the step as a concrete output, not as a thought.','Write the decision/evidence you produced. If you cannot show an output, make the step smaller.'];
 return {how:g[0],example:g[1],detail};
}
function blueprintStages(path,tasks){
 if(path.includes('product validation'))return [['Problem & promise',0,4],['Test the experience',4,7],['Commercial evidence',7,8],['Decide & iterate',8,tasks.length]];
 if(path.includes('simple service'))return [['Offer foundation',0,6],['Proof',6,8],['Sell & signal',8,10],['Improve',10,tasks.length]];
 if(path.includes('digital product'))return [['Problem & buyer',0,5],['Build small',5,7],['Test demand',7,11],['Decide',11,tasks.length]];
 return [['Foundation',0,Math.ceil(tasks.length*.35)],['Build',Math.ceil(tasks.length*.35),Math.ceil(tasks.length*.60)],['Test',Math.ceil(tasks.length*.60),Math.ceil(tasks.length*.85)],['Decide',Math.ceil(tasks.length*.85),tasks.length]];
}
function renderIncomeBlueprint(path){const tasks=INCOME_PATHS[path]||[];state.aya.blueprints[path]??={steps:{}};const ws=state.aya.blueprints[path],done=Object.keys(ws.steps||{}).filter(k=>ws.steps[k]?.answer?.trim()).length;const stages=blueprintStages(path,tasks);return shell('aya','aya/grow',`${pageHead(path,'This is a working blueprint. Each step should leave behind a decision, artifact, test or evidence — not just a checked box.')}<div class="row" style="margin-bottom:12px"><button class="secondary" data-go="aya/grow/income">← Income Lab</button></div><div class="blueprint-head"><div><div class="eyebrow">Blueprint progress</div><h3>${done} / ${tasks.length} outputs saved</h3><p>Assumptions become tests; tests become evidence; evidence changes the plan.</p></div><div class="blueprint-ring" style="--p:${tasks.length?Math.round(done/tasks.length*100):0}"><b>${tasks.length?Math.round(done/tasks.length*100):0}%</b></div></div><div class="blueprint-stages">${stages.map(([label,a,z])=>`<section class="blueprint-stage"><div class="blueprint-stage-head"><span>${esc(label)}</span><small>${tasks.slice(a,z).filter((_,j)=>ws.steps[a+j]?.answer?.trim()).length}/${z-a}</small></div>${tasks.slice(a,z).map(([t,d],j)=>{const i=a+j,saved=ws.steps[i]?.answer||'',g=incomeGuide(path,t,d);return `<article class="blueprint-step ${saved?'done':''}"><div class="step-no">${String(i+1).padStart(2,'0')}</div><div class="step-copy"><b>${esc(t)}</b><p>${esc(g.how)}</p>${saved?`<div class="saved-output">${esc(saved)}</div>`:''}</div><div class="step-actions"><button class="primary" data-action="blueprint-open" data-path="${esc(path)}" data-index="${i}">${saved?'Edit output':'Work on it'}</button><button class="textbtn" data-action="bank-add" data-title="${esc(t)}" data-detail="${esc(g.how)}" data-source="Income">+ Today</button></div></article>`}).join('')}</section>`).join('')}</div>${done?`<section class="section">${sectionHead('Blueprint snapshot','The answers you have actually saved — useful for review, pricing and the next test.')}<div class="blueprint-snapshot">${tasks.map(([t],i)=>ws.steps[i]?.answer?`<div><span>${esc(t)}</span><b>${esc(ws.steps[i].answer)}</b></div>`:'').join('')}</div></section>`:''}`)}
function openBlueprintStep(path,index){const tasks=INCOME_PATHS[path]||[],item=tasks[index];if(!item)return;state.aya.blueprints[path]??={steps:{}};const saved=state.aya.blueprints[path].steps[index]?.answer||'',g=incomeGuide(path,item[0],item[1]);openModal(item[0],`Step ${index+1} of ${tasks.length} · ${path}`,`<div class="blueprint-guide"><div><span>What to do</span><p>${esc(g.how)}</p></div><div><span>Concrete example / check</span><p>${esc(g.example)}</p></div><div><span>Why this step exists</span><p>${esc(item[1])}</p></div></div><label class="form-label">My decision / evidence / output</label><textarea id="blueprintAnswer" class="textarea" placeholder="Write the actual output from this step…">${esc(saved)}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" data-action="blueprint-save" data-path="${esc(path)}" data-index="${index}">Save to blueprint</button></div>`,`Income · working blueprint`)}

function weekDates(startOffset=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay()+startOffset*7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}

function dateKey(d){return zonedDateKey(d)}

function startOfMonth(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),1)}
function endOfMonth(d=new Date()){return new Date(d.getFullYear(),d.getMonth()+1,1)}

function monthCalendar(owner,ref,ev){const first=startOfMonth(ref),last=endOfMonth(ref),startPad=(first.getDay()+6)%7,days=Math.round((last-first)/86400000),todayKey=dateKey(new Date());const cells=[];for(let i=0;i<startPad;i++)cells.push(`<div class="review-day empty"></div>`);for(let n=1;n<=days;n++){const d=new Date(first.getFullYear(),first.getMonth(),n),key=dateKey(d),dayEv=ev.filter(e=>dateKey(e.at)===key),kinds=[...new Set(dayEv.map(e=>e.kind))].slice(0,4);cells.push(`<button class="review-day ${key===todayKey?'today':''}" data-action="review-day" data-owner="${owner}" data-date="${key}"><b>${n}</b><div class="review-dots">${kinds.map(k=>`<i class="review-dot ${k}"></i>`).join('')}</div></button>`)}return `<div class="review-calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="review-dow">${x}</div>`).join('')}${cells.join('')}</div>`}
function reviewDashboard(owner){window.__reviewModes??={};const mode=window.__reviewModes[owner]||'week',nowD=new Date(),start=mode==='week'?startOfWeek(nowD):startOfMonth(nowD),end=mode==='week'?endOfWeek(nowD):endOfMonth(nowD),ev=eventsBetween(owner,start,end),metrics=reviewMetrics(owner,ev),title=mode==='week'?'This week':nowD.toLocaleDateString(undefined,{month:'long',year:'numeric'}),subtitle=owner==='aya'?`How life actually moved · ${feelingSummary(ev)}`:'Work, outreach, body and recharge from real actions.';let visual='';if(mode==='week'){const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});visual=`<div class="review-week-strip">${days.map(d=>reviewDayButton(owner,d,ev,dateKey(nowD))).join('')}</div>`}else visual=monthCalendar(owner,nowD,ev);return `<div class="between" style="margin-bottom:12px"><div class="review-switch"><button class="${mode==='week'?'on':''}" data-action="review-mode" data-owner="${owner}" data-value="week">Week</button><button class="${mode==='month'?'on':''}" data-action="review-mode" data-owner="${owner}" data-value="month">Month</button></div><span class="small muted">${ev.length} recorded actions</span></div><div class="review-hero"><div class="eyebrow">Review</div><h2>${title}</h2><p class="small muted">${subtitle}</p><div class="review-stats">${metrics.map(([l,n])=>`<div class="review-stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>${mode==='week'?visual:''}</div>${mode==='month'?`<section class="section"><div class="panel">${visual}</div></section>`:''}<section class="section">${sectionHead('What stands out','A few grounded signals from what you actually logged.')}<div class="panel">${owner==='aya'?`<div class="grid2"><div><div class="eyebrow">Most common feeling</div><h3 class="display" style="font-size:24px;margin:5px 0">${esc(feelingSummary(ev))}</h3></div><div><div class="eyebrow">Growth evidence</div><h3 class="display" style="font-size:24px;margin:5px 0">${ev.filt function openReviewDay(owner,key){const ev=state.events.filter(e=>e.owner===owner&&dateKey(e.at)===key),plans=owner==='aya'?state.aya.week.items.filter(i=>i.date===key):[];const d=new Date(`${key}T12:00:00`);openModal(d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),ev.length?'What happened and what is planned.':'This day is open—you can plan it now.',`${owner==='aya'?`<button class="primary" data-action="review-plan-date" data-date="${key}">+ Plan something for this day</button>`:''}${plans.length?`<div class="day-review-list" style="margin-top:12px">${plans.map(i=>`<div class="day-review-row"><i></i><div><b>${esc(i.title)}</b><span>Planned · ${esc(i.type)}</span></div></div>`).join('')}</div>`:''}${ev.length?`<div class="day-review-list" style="margin-top:12px">${ev.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(e=>`<div class="day-review-row"><i></i><div><b>${esc(e.title)}</b><span>${esc(e.detail||e.kind)} · ${new Date(e.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join('')}</div>`:plans.length?'':`<div class="empty">Nothing logged yet.</div>`}`,`${owner==='aya'?'Aya':'Mohamad'} · Review`)}

function render(routeChanged=true){const r=route();let html='';if(r==='home')html=renderHome();else{const [a,b,c,d]=r.split('/').map(decodeURIComponent);if(a==='aya'){document.body.dataset.space='aya';if(b==='today')html=renderAyaToday();else if(b==='grow'&&!c)html=renderAyaGrow();else if(b==='grow'&&c)html=renderArea(c,d);else if(b==='interior'&&c&&!d)html=renderInteriorSpace(c);else if(b==='interior'&&c&&d)html=renderInteriorScene(c,d);else if(b==='week')html=renderAyaWeek();else html=renderAyaReview()}else if(a==='mohamad'){document.body.dataset.space='mohamad';if(b==='today')html=renderMohamadToday();else if(b==='leads')html=renderMohamadLeads();else if(b==='work')html=renderMohamadWork(c,d);else html=renderMohamadReview()}else if(a==='together'){document.body.dataset.space='together';if(b==='us')html=renderTogetherUs();else if(b==='home')html=renderFutureHome(c);else if(b==='money')html=renderMoney();else html=renderMemories()}else html=renderHome()}$('#app').innerHTML=html;if(routeChanged)requestAnimationFrame(()=>scrollTo(0,0))}

async function fileData(id){const input=$('#'+id),f=input?.files?.[0];if(!f)return'';const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(!f.type.startsWith('image/'))return raw;return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>resolve(raw);img.src=raw})}
function blobData(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}

renderMohamadToday=function(){ensureContactQueue();const cnt=mohTodayCounts(),project=state.mohamad.projects[0],push=state.mohamad.pushups||0,today=state.mohamad.outreach.queue.map(id=>state.mohamad.contacts.find(x=>x.id===id)).filter(x=>x&&x.status==='new'&&!x.sentText);return shell('mohamad','mohamad/today',`${feelingBand('mohamad')}${mohDirection()}<div class="life-journey mohamad-journey"><section class="journey-chapter"><span class="journey-marker">☀</span><div class="journey-copy"><div class="eyebrow">Start gently</div><h2>Wake up the body</h2><p>Choose a home movement that matches today’s energy.</p></div><div class="body-flow">${waterCard('mohamad')}<div class="push-card"><div class="push-top"><div><div class="eyebrow">Push-up counter</div><div class="push-number">${push}</div></div><span class="push-breakdown">today—not a target</span></div><div class="push-controls"><button class="secondary" data-action="pushups-adjust" data-delta="-5">−5</button><button class="softbtn" data-action="pushups-adjust" data-delta="5">+5</button><button class="primary" data-action="pushups-adjust" data-delta="10">+10</button><button class="textbtn" data-action="pushups-reset">Reset</button></div></div>${moveCard('mohamad')}</div></section><section class="journey-chapter"><span class="journey-marker">↗</span><div class="journey-copy"><div class="eyebrow">Build momentum</div><h2>Make one useful move</h2><p>One real conversation or one piece of visible work is enough to move the day.</p></div><div class="today-work-path"><button class="today-door" data-go="mohamad/leads"><i>💬</i><div><b>${today.length} people need a hello</b><span>${cnt.replies?`${cnt.replies} replies need attention too.`:'Contacted people leave Today automatically.'}</span></div></button><button class="today-door" data-go="mohamad/work"><i>✦</i><div><b>${project?esc(project.name):'Choose a creative work move'}</b><span>${project?esc(project.next||'Choose one visible next step.'):'Visibility or growth—one understandable idea at a time.'}</span></div></button></div></section><section class="journey-chapter"><span class="journey-marker">🍽</span><div class="journey-copy"><div class="eyebrow">Refuel</div><h2>Notice what kept you going</h2><p>A quick note or photo is enough.</p></div><div class="journey-meals">${mealJournal('mohamad')}</div></section><section class="journey-chapter"><span class="journey-marker">☾</span><div class="journey-copy"><div class="eyebrow">Evening</div><h2>Change the mood</h2><p>Choose the kind of break first. One fitting idea appears—not a wall of advice.</p></div>${rechargeInline()}</section></div>`)};
openWeekAdd=function(date='',owner='aya'){const chosen=/^\d{4}-\d{2}-\d{2}$/.test(date)?date:dateKey(new Date()),moh=owner==='mohamad',types=moh?['Work','Contact follow-up','Interior project','Content / visibility','Home workout','Recharge','Gaming','Appointment','Time together']:['Home','Meal prep','Meal','Shopping','Interior','My Page','Learn','Appointment','Time for me'];openModal('Give this day a shape','A plan works better when the moment is easy to recognize.',`<label class="field-label">Date</label><input id="weekDate" class="input" type="date" value="${chosen}"><div class="grid2"><div><label class="field-label">Part of life</label><select id="weekType" class="select">${types.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label class="field-label">Time · optional</label><input id="planTime" class="input" type="time"></div></div><label class="field-label">What do you want to happen?</label><input id="weekTitle" class="input" placeholder="One clear action"><label class="field-label">When this happens… · optional</label><input id="planCue" class="input" placeholder="After coffee, when work ends, before dinner…"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="primary" data-action="week-save" data-owner="${owner}">Add to this day</button></div>`,`${moh?'Mohamad':'Aya'} · Plan ahead`)};
openReviewDay=function(owner,key){const ev=state.events.filter(e=>e.owner===owner&&dateKey(e.at)===key),plans=plansFor(owner,key),d=new Date(`${key}T12:00:00`);openModal(d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),ev.length||plans.length?'What happened and what is planned.':'This day is open—you can plan it now.',`<button class="primary" data-action="review-plan-date" data-owner="${owner}" data-date="${key}">+ Plan something for this day</button>${plans.length?`<div class="day-review-list" style="margin-top:12px">${plans.map(i=>`<div class="day-review-row"><i></i><div><b>${esc(i.title)}</b><span>${i.time?esc(i.time)+' · ':''}${esc(i.type)}${i.cue?` · ${esc(i.cue)}`:''}</span></div></div>`).join('')}</div>`:''}${ev.length?`<div class="day-review-list" style="margin-top:12px">${ev.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(e=>`<div class="day-review-row"><i></i><div><b>${esc(e.title)}</b><span>${esc(e.detail||e.kind)} · ${new Date(e.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join('')}</div>`:plans.length?'':`<div class="empty">Nothing logged yet.</div>`}`,`${owner==='aya'?'Aya':'Mohamad'} · Review`)};
/* Integrated personal-growth system. The structure is shared; the content stays personal. */
state.aya.customAreas??=[];
state.mohamad.customAreas??=[];
state.aya.dayDirection??='';
state.mohamad.dayDirection??='';

const DAY_DIRECTIONS={
 aya:[['gentle','Gentle'],['clear','Clear'],['creative','Creative'],['grounded','Grounded'],['brave','Brave']],
 mohamad:[['focused','Focused'],['strong','Strong'],['steady','Steady'],['quiet','Quiet'],['playful','More fun']]
};
function dayDirection(owner){const name=owner==='aya'?'Aya':'Mohamad',v=state[owner].dayDirection||'';return `<div class="day-direction"><div class="day-direction-copy"><b>How should today feel?</b><span>${name}, choose a direction—not another target.</span></div><div class="day-direction-options">${DAY_DIRECTIONS[owner].map(([id,label])=>`<button class="${v===id?'on':''}" data-action="day-direction" data-owner="${owner}" data-value="${id}">${label}</button>`).join('')}</div></div>`}
mohDirection=()=>dayDirection('mohamad');
function relationshipBridge(owner){const other=owner==='aya'?'mohamad':'aya',otherName=other==='aya'?'Aya':'Mohamad',need=state.together?.needs?.[other]||'';if(!need)return'';return `<div class="relationship-bridge"><i>♡</i><div><b>${otherName} left a small signal</b><span>${esc(need)} · notice it when you have room.</span></div><button data-go="together/us">Meet there →</button></div>`}

function personalAreaLine(owner,a){const icon=owner==='aya'?'✦':'↗';return `<button class="growth-line custom" data-action="personal-area-open" data-owner="${owner}" data-id="${a.id}"><i>${icon}</i><span><b>${esc(a.title)}</b><small>${esc(a.why||a.next||'A direction you chose for yourself.')}</small></span><strong>Open →</strong></button>`}
function personalAreaBand(owner){const areas=state[owner].customAreas||[],aya=owner==='aya';return `<div class="personal-directions"><div class="personal-directions-head"><div><b>${aya?'My own directions':'My own work directions'}</b><span> · ${areas.length?`${areas.length} growing`:'nothing added yet'}</span></div><button class="textbtn" data-action="personal-area-add" data-owner="${owner}">＋ ${aya?'Add an area':'Add a direction'}</button></div>${areas.length?`<div class="personal-directions-flow">${areas.map(a=>`<button class="personal-direction" data-action="personal-area-open" data-owner="${owner}" data-id="${a.id}"><i>${aya?'✦':'↗'}</i><span><b>${esc(a.title)}</b><small>${esc(a.next||a.why||'Choose the next small move')}</small></span><strong>Open</strong></button>`).join('')}</div>`:''}</div>`}
function openPersonalAreaForm(owner,item=null){const aya=owner==='aya',label=aya?'growth area':'work direction';openModal(item?`Edit ${item.title}`:`Add your own ${label}`,'The prepared areas are starting points. Add anything that matters to you.',`<label class="field-label">What do you want to grow?</label><input id="personalAreaTitle" class="input" value="${esc(item?.title||'')}" placeholder="${aya?'A skill, subject, habit, or project':'A skill, service, project, or business direction'}"><label class="field-label">Why does it matter now?</label><input id="personalAreaWhy" class="input" value="${esc(item?.why||'')}" placeholder="One honest reason"><label class="field-label">What is one small next step?</label><input id="personalAreaNext" class="input" value="${esc(item?.next||'')}" placeholder="Something you can actually begin"><div class="row" style="justify-content:space-between;margin-top:14px">${item?`<button class="textbtn" data-action="personal-area-delete" data-owner="${owner}" data-id="${item.id}">Remove</button>`:'<span></span>'}<button class="primary" data-action="personal-area-save" data-owner="${owner}" data-id="${item?.id||''}">Save this direction</button></div>`,`${aya?'Aya · Grow':'Mohamad · Work'}`)}
function openPersonalArea(owner,id){const item=(state[owner].customAreas||[]).find(x=>x.id===id);if(!item)return;const aya=owner==='aya';openModal(item.title,item.why||'A direction you chose for yourself.',`<div class="personal-area-focus"><div class="eyebrow">One visible next step</div><h3 class="display" style="font-size:26px;margin:6px 0 8px">${esc(item.next||'Choose the first small move')}</h3><p class="small muted">Send only this step to Today. The whole area stays here.</p></div><div class="row" style="margin-top:18px"><button class="primary" data-action="personal-area-today" data-owner="${owner}" data-id="${item.id}">＋ Add next step to Today</button><button class="secondary" data-action="personal-area-edit" data-owner="${owner}" data-id="${item.id}">Edit</button></div>`,`${aya?'Aya · Grow':'Mohamad · Work'}`)}

renderAyaGrow=function(){const custom=state.aya.customAreas||[];return shell('aya','aya/grow',`${pageHead('Grow','Choose one direction when it matters. The prepared paths stay here, and you can add your own.')}<div class="growth-map">${Object.entries(CAREER_AREAS).map(([k,a])=>`<button class="growth-line ${a.cls}" data-go="aya/grow/${k}"><i>${a.icon}</i><span><b>${a.label}</b><small>${a.sub}</small></span><strong>Open →</strong></button>`).join('')}${custom.map(a=>personalAreaLine('aya',a)).join('')}<button class="growth-line add-own" data-action="personal-area-add" data-owner="aya"><i>＋</i><span><b>Add something that is yours</b><small>A skill, subject, habit or project that is not in the prepared paths.</small></span><strong>Add</strong></button></div>`)};

const renderMohamadWorkIntegrated=renderMohamadWork;
renderMohamadWork=function(section='',sub=''){const html=renderMohamadWorkIntegrated(section,sub);if(section)return html;const band=personalAreaBand('mohamad');return html.replace('</div><div class="creative-work-stage">',`</div>${band}<div class="creative-work-stage">`)};

const renderAyaTodayIntegrated=renderAyaToday;
renderAyaToday=function(){const html=renderAyaTodayIntegrated(),band=feelingBand('aya');return html.replace(band,band+dayDirection('aya'))};

const renderFutureHomeIntegrated=renderFutureHome;
renderFutureHome=function(cat=''){return renderFutureHomeIntegrated(cat).replace('Move from the whole home to one small decision. Nothing else competes for attention.','Choose the room, then one part. Everything else stays quiet.').replace('Choose the part you are thinking about. Its saved and suggested items will open here—without leaving this page.','Choose one part. Your saved ideas and the useful starting list open here.')};

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='day-direction'){state[b.dataset.owner].dayDirection=b.dataset.value;record(b.dataset.owner,'check-in','Day direction',b.textContent.trim());save();preserveRender();return}if(a==='personal-area-add'){openPersonalAreaForm(b.dataset.owner);return}if(a==='personal-area-open'){openPersonalArea(b.dataset.owner,b.dataset.id);return}if(a==='personal-area-edit'){const owner=b.dataset.owner,item=(state[owner].customAreas||[]).find(x=>x.id===b.dataset.id);if(item)openPersonalAreaForm(owner,item);return}if(a==='personal-area-save'){const owner=b.dataset.owner,title=$('#personalAreaTitle')?.value.trim();if(!title)return toast('Give this direction a name');const list=state[owner].customAreas||[],id=b.dataset.id;let item=id?list.find(x=>x.id===id):null;if(!item){item={id:uid(),createdAt:now()};list.push(item);state[owner].customAreas=list}item.title=title;item.why=$('#personalAreaWhy')?.value.trim()||'';item.next=$('#personalAreaNext')?.value.trim()||'';record(owner,owner==='aya'?'growth':'work','Personal direction saved',title);save();closeModal();preserveRender();toast('Your direction is ready');return}if(a==='personal-area-today'){const owner=b.dataset.owner,item=(state[owner].customAreas||[]).find(x=>x.id===b.dataset.id);if(item){closeModal();addTask(owner,item.next||`Take one small step in ${item.title}`,item.why,item.title)}return}if(a==='personal-area-delete'){const owner=b.dataset.owner,item=(state[owner].customAreas||[]).find(x=>x.id===b.dataset.id);if(!item||!confirm(`Remove ${item.title}?`))return;state[owner].customAreas=state[owner].customAreas.filter(x=>x.id!==item.id);save();closeModal();preserveRender();return}});

/* Stronger personal direction for Aya: supportive, but still action-oriented. */
DAY_DIRECTIONS.aya=[['focused','Focused'],['strong','Strong'],['steady','Steady'],['quiet','Quiet'],['playful','More fun']];

function sharedLifeRibbon(){const t=moneyTotals(),moments=state.together.memories.length,home=state.together.wishlist.length,talk=state.together.talkLater.length;return `<nav class="shared-life-ribbon" aria-label="Our shared life"><button data-action="appreciation"><i>♡</i><b>Say something kind</b><small>A real sentence, without turning it into a task.</small></button><button data-go="together/memories"><i>✦</i><b>Keep a memory</b><small>${moments?`${moments} moments kept`:'A photo or sentence is enough.'}</small></button><button data-go="together/home"><i>⌂</i><b>Shape our home</b><small>${home?`${home} ideas becoming real`:'Begin with one real need.'}</small></button><button data-go="together/money"><i>◌</i><b>See what we’re building</b><small>${t.income||t.expense?`$${Math.max(0,t.income-t.expense).toFixed(0)} visible together`:talk?`${talk} conversations saved for later`:'Open it only when something moves.'}</small></button></nav>`}

renderTogetherUs=function(){state.together.dailyAnswers??={};state.together.voiceAnswers??={};const entry=state.together.dailyAnswers[dayKey()]||{},both=!!(entry.aya&&entry.mohamad);return shell('together','together/us',`${pageHead('Us','One small place to notice each other, play, and keep what matters.')}<div class="shared-story"><section class="shared-chapter shared-now"><div class="shared-chapter-head"><div class="eyebrow">Right now</div><h2>How can we meet each other today?</h2><p>Share a signal. It does not need to become a conversation immediately.</p></div><div class="connection-orbit">${personPulse('aya')}<div class="us-heart"><span>♡</span></div>${personPulse('mohamad')}</div></section><section class="shared-chapter shared-question-scene"><div class="shared-chapter-head"><div class="eyebrow">One question · two answers</div><h2>${esc(sharedQuestion())}</h2><p>Each answer stays hidden in this view until both of you respond.</p></div><div class="shared-answer-pair"><button data-action="shared-answer" data-who="aya"><i>A</i><b>Aya</b><span>${entry.aya?'answer saved ✓':'choose an answer'}</span></button><i class="shared-answer-link">♡</i><button data-action="shared-answer" data-who="mohamad"><i>M</i><b>Mohamad</b><span>${entry.mohamad?'answer saved ✓':'choose an answer'}</span></button></div>${both?`<div class="shared-open-answers"><p><b>Aya</b>${esc(entry.aya)}</p><p><b>Mohamad</b>${esc(entry.mohamad)}</p></div>`:`<div class="shared-locked">Your answers will meet here when both are ready.</div>`}<div class="us-keepbar"><button class="us-keep" data-action="appreciation">♡ Appreciation</button><button class="us-keep" data-action="talk-later">💬 Talk later</button><button class="us-keep" data-action="memory-add" data-type="Moment">✦ Keep this moment</button></div></section><section class="shared-chapter shared-voice-scene"><div class="shared-chapter-head"><div class="eyebrow">Hear me when we are both ready</div><h2>Leave a little piece of your day</h2><p>This device opens the two voice notes together after both are saved.</p></div>${sharedVoiceExchange().replace('<div><div class="eyebrow">Hear me when we are both ready</div><h3>Leave a little piece of your day</h3><p>Tap record and speak. Each note stays closed until both of you leave one.</p></div>','')}</section><section class="shared-chapter shared-play-scene"><div class="shared-chapter-head"><div class="eyebrow">A little us-time</div><h2>Choose the kind of moment you want</h2><p>One playful idea appears. Keep it, change it, or leave it.</p></div>${usDeck()}</section>${sharedLifeRibbon()}</div>`) };

/* Release utilities: honest local data protection and accessible dialogs. */
const renderAyaTodayRelease=renderAyaToday;
renderAyaToday=function(){const html=renderAyaTodayRelease();return html.replace(dayDirection('aya'),dayDirection('aya')+relationshipBridge('aya'))};
const renderMohamadTodayRelease=renderMohamadToday;
renderMohamadToday=function(){const html=renderMohamadTodayRelease();return html.replace(dayDirection('mohamad'),dayDirection('mohamad')+relationshipBridge('mohamad'))};

function openDataTools(){const who=state.meta.currentMember;openModal('Keep your OneSpace safe','This version saves on this browser. A backup protects your plans, contacts, memories and photos if the browser data is cleared.',`<div class="data-note"><b>Using this browser as:</b> choose the right person so shared memories and money movements show the correct name.<div class="row" style="margin-top:10px"><button class="secondary ${who==='aya'?'on':''}" data-action="set-current-member" data-member="aya">${who==='aya'?'✓ ':''}Aya</button><button class="secondary ${who==='mohamad'?'on':''}" data-action="set-current-member" data-member="mohamad">${who==='mohamad'?'✓ ':''}Mohamad</button></div></div><div class="data-tools"><button class="data-tool" data-action="export-data"><b>Download backup</b><span>Save one dated JSON file containing the current OneSpace.</span></button><label class="data-tool" for="restoreData"><b>Restore backup</b><span>Choose a OneSpace JSON file. You will confirm before it replaces this browser’s data.</span></label></div><input id="restoreData" type="file" accept="application/json,.json" hidden><p class="small muted" style="margin-top:14px">This member switch fixes authorship on one browser; it is not a password or secure account. Real privacy and sync still need a backend.</p>`,'OneSpace · Data')}
function exportData(){const payload=JSON.stringify({product:'OneSpace',schemaVersion:APP_SCHEMA_VERSION,exportedAt:now(),data:state},null,2),blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`onespace-backup-${dayKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')}

let modalReturnFocus=null;
const openModalRelease=openModal,closeModalRelease=closeModal;
openModal=function(...args){modalReturnFocus=document.activeElement;openModalRelease(...args);$('#modal').setAttribute('aria-hidden','false');requestAnimationFrame(()=>$('#modal .modalbox')?.focus())};
closeModal=function(){closeModalRelease();$('#modal').setAttribute('aria-hidden','true');modalReturnFocus?.focus?.();modalReturnFocus=null};

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='data-tools'){openDataTools();return}if(b.dataset.action==='export-data'){exportData();return}if(b.dataset.action==='set-current-member'){const member=b.dataset.member;if(!['aya','mohamad'].includes(member))return;state.meta.currentMember=member;CONFIG.user=member==='mohamad'?{id:'mohamad',name:'Mohamad'}:{id:'aya',name:'Aya'};save();openDataTools();toast(`Now using OneSpace as ${CONFIG.user.name}`);return}});
document.addEventListener('change',async e=>{if(e.target.id!=='restoreData'||!e.target.files?.[0])return;try{const parsed=JSON.parse(await e.target.files[0].text()),incoming=parsed.data||parsed;if(!incoming||typeof incoming!=='object'||!incoming.aya||!incoming.mohamad||!incoming.together)throw new Error('Invalid backup');if(!confirm('Replace the data saved in this browser with this backup?'))return;state=migrateState(mergeDefaults(clone(DEFAULT),incoming));normalizeProductState();CONFIG.user=state.meta.currentMember==='mohamad'?{id:'mohamad',name:'Mohamad'}:{id:'aya',name:'Aya'};save();closeModal();render(true);toast('Backup restored')}catch(error){toast('That file is not a valid OneSpace backup')}});
$('#scrim').addEventListener('click',()=>{if($('#modal').classList.contains('on'))closeModal()});
document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('on'))return;if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const items=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),label[for],[tabindex]:not([tabindex="-1"])',$('#modal')).filter(x=>x.offsetParent!==null);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

save();
render(true);
</script>
