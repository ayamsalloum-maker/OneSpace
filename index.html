.us-cover{position:relative;min-height:500px;border-radius:46px;overflow:hidden;background:linear-gradient(145deg,#fae4ea,#f7ebd5 55%,#e3f1ec);display:grid;place-items:center;padding:45px 24px;text-align:center}.us-cover:before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;border:1px solid rgba(45,38,55,.07)}.us-cover:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.25);right:-45px;top:-60px}.us-cover-copy{position:relative;z-index:3;max-width:650px}.us-cover-copy h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,76px);line-height:.95;letter-spacing:-.06em;margin:8px 0 15px}.us-cover-copy blockquote{font-size:14px;color:var(--muted);margin:0 auto 24px;max-width:520px}.us-people{display:flex;align-items:center;justify-content:center;gap:0;margin:25px 0}.us-person-orb{width:112px;height:112px;border-radius:50%;border:5px solid rgba(255,255,255,.78);display:grid;place-items:center;background:#ffdcd3;font-family:Georgia,serif;font-size:35px;position:relative}.us-person-orb.mohamad{background:#d7edf1;margin-left:-18px}.us-person-orb small{position:absolute;bottom:-24px;white-space:nowrap;font:800 10px/1 Inter,sans-serif;color:var(--muted)}.us-cover-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.us-cover-actions button{border:0;border-radius:999px;background:rgba(255,255,255,.72);padding:10px 14px;font-weight:850}.us-cover-actions button.primary{background:var(--ink);color:#fff}
.relationship-journey{margin:55px auto 0;max-width:820px}.relationship-journey .shared-story{padding:0;border:0;background:transparent}.relationship-journey .story-kicker{display:none}.relationship-journey .story-path{max-width:500px;margin:0 auto 30px;border-bottom:1px solid var(--line)}.relationship-journey .story-step{border:0;border-radius:0;background:transparent;border-bottom:3px solid transparent}.relationship-journey .story-step.on{background:transparent;color:var(--ink);border-bottom-color:var(--us)}.relationship-journey .story-scene{border:0;border-radius:0;background:transparent;padding:25px 0}.relationship-journey .story-scene>em{background:transparent}.relationship-journey .us-person-node{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}.relationship-journey .future-chip{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}.relationship-journey .shared-quick{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}.relationship-journey .shared-quick button{background:transparent}
.life-river{margin:70px auto 0;max-width:760px;position:relative}.life-river:before{content:"";position:absolute;left:50%;top:70px;bottom:40px;width:1px;background:linear-gradient(var(--us),var(--us2),var(--us3))}.life-river-head{text-align:center;margin-bottom:25px}.life-river-head h2{font-family:Georgia,serif;font-size:38px;margin:4px 0}.life-chapter{width:50%;border:0;background:transparent;padding:24px 55px 35px 0;text-align:right;position:relative;display:block}.life-chapter:nth-of-type(even){margin-left:50%;padding:24px 0 35px 55px;text-align:left}.life-chapter:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--us);right:-8px;top:31px}.life-chapter:nth-of-type(even):after{right:auto;left:-7px;border-color:var(--us3)}.life-chapter strong{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.life-chapter b{display:block;font-family:Georgia,serif;font-size:27px;margin:5px 0}.life-chapter span{font-size:12px;color:var(--muted);line-height:1.55}

/* Future Home begins with atmosphere, then opens into living worlds. */
.home-dream{position:relative;min-height:500px;border-radius:46px;overflow:hidden;background:linear-gradient(145deg,#f7e1e6 0%,#f6edd8 55%,#e4f1ec 100%);display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(28px,5vw,60px);gap:25px}.home-dream-copy{position:relative;z-index:3}.home-dream-copy h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,78px);line-height:.94;letter-spacing:-.06em;margin:7px 0 16px}.home-dream-copy p{color:var(--muted);max-width:460px}.home-scene{height:330px;position:relative}.home-scene .window{position:absolute;width:145px;height:190px;border:9px solid rgba(255,255,255,.8);left:12%;top:5%;background:linear-gradient(#cfe6e4 0 60%,#e8d5bc 60%)}.home-scene .sofa{position:absolute;width:230px;height:92px;border-radius:45px 45px 17px 17px;background:#d6a9a3;right:4%;bottom:23%;box-shadow:0 32px 0 -20px #b48478}.home-scene .lamp{position:absolute;width:7px;height:145px;background:#8c7d70;right:13%;top:5%}.home-scene .lamp:before{content:"";position:absolute;width:72px;height:50px;border-radius:50% 50% 15px 15px;background:#f0d596;left:-32px;top:-4px}.home-scene .plant{position:absolute;width:55px;height:70px;border-radius:50% 10% 50% 10%;background:#7fa18b;left:5%;bottom:14%;transform:rotate(-15deg)}
.home-worlds{display:flex;justify-content:center;gap:35px;margin:35px 0 0;border-bottom:1px solid var(--line)}.home-world{border:0;background:transparent;padding:16px 4px 18px;border-bottom:3px solid transparent;text-align:center}.home-world.on{border-bottom-color:var(--us)}.home-world b{display:block;font-family:Georgia,serif;font-size:23px}.home-world span{font-size:10px;color:var(--muted)}
.home-doorways{display:grid;grid-template-columns:repeat(5,1fr);margin-top:35px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.home-doorway{border:0;border-right:1px solid var(--line);background:transparent;min-height:155px;padding:22px 14px;text-align:left}.home-doorway:last-child{border-right:0}.home-doorway em{font-style:normal;font-size:27px}.home-doorway b{display:block;font-family:Georgia,serif;font-size:21px;margin:12px 0 4px}.home-doorway span{font-size:11px;color:var(--muted)}
.home-progress-line{display:flex;justify-content:center;gap:28px;margin-top:25px}.home-progress-line button{border:0;background:transparent;text-align:center;border-bottom:2px solid transparent;padding:8px}.home-progress-line button.on{border-bottom-color:var(--us)}.home-progress-line b{font-family:Georgia,serif;font-size:24px;display:block}.home-progress-line span{font-size:10px;color:var(--muted)}

@media(max-width:800px){.day-experience,.home-dream{grid-template-columns:1fr}.feeling-cloud{min-height:240px}.home-scene{height:250px}.home-doorways{grid-template-columns:repeat(2,1fr)}.home-doorway{border-bottom:1px solid var(--line)}.today-nudge{grid-template-columns:1fr}.today-nudge button{border-right:0;border-bottom:1px solid var(--line)}}
@media(max-width:620px){.day-experience,.us-cover,.home-dream{border-radius:28px;padding:25px 18px}.day-experience{min-height:560px}.day-intro h1,.us-cover-copy h1,.home-dream-copy h1{font-size:44px}.feeling-cloud{min-height:220px}.day-flow-head{grid-template-columns:1fr}.day-rhythm{grid-template-columns:1fr}.day-rhythm .visual-card:first-child{border-right:0;border-bottom:1px solid var(--line);padding-right:0}.day-rhythm .visual-card:last-child{padding-left:0}.day-meals .meal-journal{grid-template-columns:1fr 1fr}.day-meals .meal:nth-child(2){border-right:0}.day-meals .meal:nth-child(-n+2){border-bottom:1px solid var(--line)}.personal-doors{display:grid;grid-template-columns:1fr 1fr}.personal-door:nth-child(2){border-right:0}.personal-door:nth-child(-n+2){border-bottom:1px solid var(--line)}.us-cover{min-height:500px}.relationship-journey{margin-top:40px}.life-river:before{left:13px}.life-chapter,.life-chapter:nth-of-type(even){width:100%;margin:0;padding:20px 0 28px 42px;text-align:left}.life-chapter:after,.life-chapter:nth-of-type(even):after{left:6px;right:auto}.home-scene{height:220px}.home-scene .sofa{width:190px}.home-worlds{gap:8px}.home-world b{font-size:16px}.home-doorways{grid-template-columns:1fr 1fr}.home-progress-line{gap:5px}.home-progress-line button{flex:1}}

/* V17 · colour, focus and progressive disclosure */
:root{--bg:#fffaf5;--paper:#fffefa;--ink:#272034;--muted:#6e6472;--aya:#ee674f;--aya2:#8b61d3;--aya3:#edae31;--moh:#087f98;--moh2:#3b66bc;--moh3:#3f9b70;--us:#c64f7c;--us2:#d69a35;--us3:#438f7b}
body{background:radial-gradient(circle at 8% 0%,rgba(238,103,79,.17),transparent 32%),radial-gradient(circle at 90% 4%,rgba(139,97,211,.14),transparent 29%),#fffaf5}
body[data-space="mohamad"]{background:radial-gradient(circle at 8% 0%,rgba(8,127,152,.18),transparent 32%),radial-gradient(circle at 90% 4%,rgba(59,102,188,.14),transparent 29%),#f8fcfb}
body[data-space="together"]{background:radial-gradient(circle at 8% 0%,rgba(198,79,124,.17),transparent 32%),radial-gradient(circle at 90% 4%,rgba(214,154,53,.16),transparent 29%),#fffaf6}
.mark{background:linear-gradient(145deg,#ffb19f,#c8adff);color:#281f35}.section-head h2,.page-head h1{color:#281f35}
.day-experience.aya{background:linear-gradient(128deg,#ffd7cb 0%,#eadcff 52%,#dff1e4 100%)}.day-experience.mohamad{background:linear-gradient(128deg,#cbece8 0%,#d9e5ff 55%,#f4e3b5 100%)}
.day-experience{box-shadow:0 22px 70px rgba(52,42,68,.10)}.feeling-cloud .feeling{border-color:rgba(45,38,55,.12);background:rgba(255,255,255,.82)}.day-rhythm .visual-card{background:linear-gradient(180deg,rgba(255,255,255,.34),transparent)}

/* One open activity at a time; the library remains present without filling the page. */
.task-stories{border-top:1px solid var(--line)}.task-story{border-bottom:1px solid var(--line)}.task-story summary{list-style:none;cursor:pointer;padding:20px 3px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}.task-story summary::-webkit-details-marker{display:none}.task-story-index{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--soft),#fff);display:grid;place-items:center;font-family:Georgia,serif;font-weight:900}.task-story summary b{font-family:Georgia,serif;font-size:23px}.task-story summary span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.task-story-arrow{font-size:20px;color:var(--accent)}.task-story[open] summary{color:var(--accent)}.task-story-body{padding:0 0 24px 55px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}.task-story-body p{margin:0;color:var(--muted);line-height:1.6}.task-story-done{margin-top:12px;border-left:3px solid var(--accent);padding-left:12px;font-size:12px}.coach-intro{background:linear-gradient(100deg,color-mix(in srgb,var(--soft) 82%,#fff),rgba(255,255,255,.65));border-left:0;border-radius:24px;padding:20px 22px;box-shadow:0 10px 28px rgba(52,42,68,.06)}

/* Interior studio: one strong visual per project, with more air between them. */
.spacegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.spacecard{border-radius:30px;box-shadow:0 14px 38px rgba(52,42,68,.09);background:#fff;transition:.2s ease}.spacecard:hover{transform:translateY(-4px)}.spacevisual{height:210px}.spacecopy{padding:19px 20px 21px}.spacecopy h3{font-size:27px}.spacecopy span{font-size:12px}.spacecard:nth-child(3n+1) .spacevisual{background-color:#f6d9d0}.spacecard:nth-child(3n+2) .spacevisual{background-color:#d8e9ef}.spacecard:nth-child(3n) .spacevisual{background-color:#e7ddf4}
.scenegrid{grid-template-columns:1fr 1fr;gap:16px}.scene{min-height:160px;border:0;border-radius:27px;background:linear-gradient(145deg,#fff,#f4edff);box-shadow:0 12px 30px rgba(52,42,68,.065);padding:22px}.scene:nth-child(2n){background:linear-gradient(145deg,#fff,#e6f4f0)}.scene h3{font-size:26px}
.project-drawings{grid-template-columns:1fr;gap:22px}.practice-plan,.ceiling-card{background:#fff;border:1px solid rgba(45,38,55,.10);border-radius:28px;padding:20px;box-shadow:0 15px 35px rgba(52,42,68,.06)}.practice-plan svg,.ceiling-plan svg{min-height:360px}.ceiling-plan{background:#fbfaf7;border-radius:20px;padding:16px}.plan-wall{stroke:#2d2637;stroke-width:8;fill:#fffefa}.plan-window{stroke:#2f9bb0;stroke-width:8}.plan-door{stroke:#c65b73;stroke-width:3}.plan-furn{fill:#f3c7bd;stroke:#8b514c;stroke-width:2}.plan-furn2{fill:#b9dcd6;stroke:#3b756e;stroke-width:2}.plan-counter{fill:#d7c6e8;stroke:#6a5484;stroke-width:2}.plan-water{fill:#c9e8ef;stroke:#367989;stroke-width:2}.plan-tv{fill:#34465a}.plan-label{font-size:12px;font-weight:850;fill:#3b3344}.plan-dim{font-size:11px;font-weight:850;fill:#6f6676}.drawing-legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0;font-size:10px;color:var(--muted)}.drawing-legend i{width:16px;height:5px;border-radius:99px;display:inline-block;margin-right:4px}.plan-note{padding:10px 12px;border-radius:14px;background:#fff3d7;font-size:11px;color:#6d572e;margin-top:10px}

/* Recharge becomes a little scene, not a menu dumped into a modal. */
.recharge-stage{--recharge:#4d77c8;position:relative;overflow:hidden;border-radius:32px;padding:30px;background:linear-gradient(145deg,color-mix(in srgb,var(--recharge) 28%,#fff),#fff);min-height:420px}.recharge-stage[data-kind="Gaming"]{--recharge:#7656c7}.recharge-stage[data-kind="Music"]{--recharge:#d05b91}.recharge-stage[data-kind="Rest"]{--recharge:#4d9a78}.recharge-stage[data-kind="Outside"]{--recharge:#e39a2e}.recharge-art{height:150px;position:relative;display:grid;place-items:center}.recharge-art>span{width:105px;height:105px;border-radius:34px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:48px;position:relative;z-index:2;box-shadow:0 15px 35px rgba(52,42,68,.09)}.recharge-art:before,.recharge-art:after{content:"";position:absolute;height:3px;border-radius:99px;background:var(--recharge);width:72%;transform:rotate(-8deg)}.recharge-art:after{transform:rotate(9deg);opacity:.45}.recharge-stage h3{font-family:Georgia,serif;font-size:34px;line-height:1.05;margin:12px 0 9px}.recharge-stage p{color:var(--muted);line-height:1.6}.recharge-stage .recharge-controls{margin-top:25px}.recharge-stage .primary{background:var(--recharge)}

/* Names, feelings and relationship hierarchy are explicit. */
.us-presence{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:27px auto 30px;max-width:570px}.presence-person{border:0;background:transparent;text-align:center}.presence-avatar{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#ffb7a7;border:5px solid rgba(255,255,255,.78);font-family:Georgia,serif;font-size:35px}.presence-person.mohamad .presence-avatar{background:#9fd9dc}.presence-person b{display:block;font-family:Georgia,serif;font-size:22px;margin-top:10px}.presence-person span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.presence-link{font-size:30px;color:var(--us)}

/* Future Home reveals one living area at a time. */
.home-space-focus{max-width:820px;margin:35px auto 0;display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:38px;min-height:330px}.space-focus-art{height:300px;border-radius:42% 58% 35% 65% / 48% 37% 63% 52%;background:linear-gradient(145deg,#ffcabb,#e3d2ff 52%,#bde2d6);display:grid;place-items:center;font-size:78px;position:relative;animation:homeBreathe 8s ease-in-out infinite}.space-focus-art:after{content:"";position:absolute;width:70%;height:70%;border:1px solid rgba(255,255,255,.68);border-radius:inherit}.space-focus-copy h2{font-family:Georgia,serif;font-size:clamp(37px,5vw,56px);line-height:1;margin:7px 0 12px}.space-focus-copy p{color:var(--muted)}.space-name-strip{display:flex;gap:18px;justify-content:center;overflow:auto;padding:22px 0 8px;scrollbar-width:none}.space-name{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 2px;border-bottom:2px solid transparent;font-weight:850}.space-name.on{color:var(--ink);border-bottom-color:var(--us)}
@keyframes homeBreathe{0%,100%{border-radius:42% 58% 35% 65% / 48% 37% 63% 52%;transform:translateY(0)}50%{border-radius:55% 45% 58% 42% / 38% 57% 43% 62%;transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.space-focus-art{animation:none}.spacecard{transition:none}}
@media(max-width:700px){.spacegrid,.scenegrid{grid-template-columns:1fr}.spacevisual{height:180px}.task-story-body{grid-template-columns:1fr;padding-left:0}.project-drawings{gap:14px}.practice-plan svg,.ceiling-plan svg{min-height:260px}.home-space-focus{grid-template-columns:1fr;text-align:center}.space-focus-art{height:230px}.us-presence{grid-template-columns:1fr 40px 1fr;gap:5px}.presence-avatar{width:86px;height:86px}.presence-person b{font-size:18px}}

/* V18 · alive, calm and intentional — colour belongs to the experience, not to beige boxes */
:root{
 --bg:#fff9f5;--paper:#fffefd;--ink:#241b32;--muted:#6b6070;--line:rgba(36,27,50,.115);
 --shadow:0 22px 65px rgba(67,45,85,.11);--shadow2:0 10px 32px rgba(67,45,85,.085)
}
body{
 background:
  radial-gradient(ellipse at -5% 4%,rgba(255,133,105,.24),transparent 32%),
  radial-gradient(ellipse at 103% 0%,rgba(147,104,224,.20),transparent 31%),
  linear-gradient(180deg,#fff8f3 0%,#fffcfa 50%,#f8f3ff 100%);
 background-attachment:fixed
}
body[data-space="aya"]{
 background:
  radial-gradient(ellipse at 2% 0%,rgba(255,112,86,.25),transparent 33%),
  radial-gradient(ellipse at 96% 7%,rgba(148,103,222,.23),transparent 31%),
  radial-gradient(ellipse at 50% 105%,rgba(244,183,65,.14),transparent 35%),
  linear-gradient(180deg,#fff8f4,#fffbff 58%,#fff9f1)
}
body[data-space="mohamad"]{
 background:
  radial-gradient(ellipse at 0% 1%,rgba(0,145,167,.23),transparent 34%),
  radial-gradient(ellipse at 98% 5%,rgba(57,103,198,.22),transparent 32%),
  radial-gradient(ellipse at 48% 108%,rgba(61,169,115,.14),transparent 36%),
  linear-gradient(180deg,#f4fcfb,#f8faff 58%,#f5fbf7)
}
body[data-space="together"]{
 background:
  radial-gradient(ellipse at 1% 0%,rgba(217,77,128,.22),transparent 33%),
  radial-gradient(ellipse at 98% 4%,rgba(226,164,48,.20),transparent 32%),
  radial-gradient(ellipse at 50% 108%,rgba(48,153,127,.14),transparent 38%),
  linear-gradient(180deg,#fff7f8,#fffbf4 55%,#f5fbf8)
}
.topbar{background:rgba(255,253,251,.82);border-bottom-color:rgba(36,27,50,.08);box-shadow:0 5px 25px rgba(62,40,75,.035)}
.mark{background:linear-gradient(145deg,#ff987f 0%,#d09cfa 58%,#ffca6f);box-shadow:0 9px 25px rgba(125,74,158,.20)}
.space-tag{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,#fff),color-mix(in srgb,var(--accent2) 12%,#fff));border-color:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:var(--shadow2)}
.navbtn{transition:background .18s ease,color .18s ease,transform .18s ease}.navbtn:hover:not(.on){background:color-mix(in srgb,var(--soft) 65%,#fff);transform:translateX(2px)}
.navbtn.on,.mobile-nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 9px 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.icon,.secondary,.chip,.media-tab{background:rgba(255,255,255,.92)}
.primary{transition:transform .17s ease,box-shadow .17s ease,filter .17s ease}.primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(36,27,50,.18);filter:saturate(1.08)}
.primary.accent{box-shadow:0 11px 26px color-mix(in srgb,var(--accent) 24%,transparent)}
.section-head h2,.page-head h1,.display{color:var(--ink)}
.eyebrow{color:color-mix(in srgb,var(--accent) 72%,var(--ink));letter-spacing:.14em}
.panel{background:rgba(255,255,255,.88);border-color:rgba(36,27,50,.09);box-shadow:var(--shadow2);backdrop-filter:blur(8px)}
.panel .panel{background:transparent;box-shadow:none;backdrop-filter:none}
.soft{background:linear-gradient(135deg,color-mix(in srgb,var(--soft) 78%,#fff),color-mix(in srgb,var(--accent2) 9%,#fff))}

/* The three entrances feel like people and a shared life, not product tiles. */
.portal{isolation:isolate;box-shadow:0 26px 70px rgba(62,41,78,.15);border:1px solid rgba(255,255,255,.75)}
.portal.aya{background:linear-gradient(135deg,#ff9c85 0%,#ffd0c4 37%,#c8a9f2 100%)}
.portal.mohamad{background:linear-gradient(135deg,#66c9c8 0%,#bfe8e1 41%,#93afe7 100%)}
.portal.us{background:linear-gradient(110deg,#ef91b1 0%,#f4c76e 53%,#87c9b5 100%)}
.portal:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.22),transparent 54%);z-index:-1}
.portal h2{color:#261b35;text-shadow:0 1px rgba(255,255,255,.45)}
.portal-art{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}

/* Today: one generous canvas, then distinct rhythms instead of one pale stream. */
.day-experience{border:1px solid rgba(255,255,255,.72);box-shadow:0 28px 80px rgba(67,45,85,.15)}
.day-experience.aya{background:linear-gradient(128deg,#ff9d87 0%,#ffd0c7 34%,#cbb0f2 70%,#b9dfca 100%)}

function shell(space,active,body){const navs=space==='aya'?[['aya/today','Today'],['aya/grow','Grow'],['aya/week','Week'],['aya/review','Review']]:space==='mohamad'?[['mohamad/today','Today'],['mohamad/leads','Leads'],['mohamad/work','Work'],['mohamad/review','Review']]:[['together/us','Us'],['together/home','Future Home'],['together/money','Money'],['together/memories','Memories']];const name=space==='aya'?'Aya':space==='mohamad'?'Mohamad':'Together';const sub=space==='aya'?'Live · grow · create':space==='mohamad'?'Work · earn · recharge':'Build · connect · remember';return `${topbar()}<main class="shell"><div class="app-grid"><aside class="sidebar"><div class="space-tag"><b>${name}</b><span>${sub}</span></div>${navs.map(([p,l])=>`<button class="navbtn ${active===p?'on':''}" data-go="${p}">${l}</button>`).join('')}</aside><section class="content">${body}</section></div></main><nav class="mobile-nav">${navs.map(([p,l])=>`<button class="${active===p?'on':''}" data-go="${p}">${l}</button>`).join('')}</nav>`}
function pageHead(title,sub='',center=false){return `<div class="page-head ${center?'center':''}"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div>`}
function sectionHead(title,sub='',action=''){return `<div class="section-head"><div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div>${action}</div>`}
function feelingBand(owner){const selected=state[owner].feelings||[];const quick=QUICK_FEELINGS.map(id=>FEELINGS.find(f=>f.id===id)).filter(Boolean);const extraSelected=selected.map(id=>FEELINGS.find(f=>f.id===id)).filter(f=>f&&!QUICK_FEELINGS.includes(f.id));return `<div class="checkin"><div class="checkin-inner"><div class="eyebrow">Check in</div><h1>How do you feel right now?</h1><div class="feelings compact">${quick.map(f=>`<button class="feeling ${selected.includes(f.id)?'on':''}" data-action="feeling" data-owner="${owner}" data-value="${f.id}"><span class="e">${f.emoji}</span>${f.label}</button>`).join('')}<button class="feeling more" data-action="feelings-more" data-owner="${owner}">＋ More feelings</button></div>${extraSelected.length?`<div class="selected-feelings">${extraSelected.map(f=>`<span class="selected-feeling">${f.emoji} ${esc(f.label)}</span>`).join('')}</div>`:''}<p class="tiny muted" style="margin:12px 0 0">Pick what feels closest. You can choose up to 2.</p></div></div>`}
function taskRows(owner,list){if(!list.length)return `<div class="empty">Nothing added yet.</div>`;return `<div class="tasklist">${list.map(t=>`<div class="task"><button class="check ${t.done?'done':''}" data-action="toggle-task" data-owner="${owner}" data-id="${t.id}">${t.done?'✓':''}</button><div><b>${esc(t.title)}</b><small>${esc(t.detail||'')}${t.source?` · ${esc(t.source)}`:''}</small></div><button class="textbtn" data-action="remove-task" data-owner="${owner}" data-id="${t.id}">Remove</button></div>`).join('')}</div>`}
function addTask(owner,title,detail='',source=''){const list=owner==='aya'?state.aya.todos:state.mohamad.todos;list.push({id:uid(),title,detail,source,done:false,at:now()});record(owner,'task','Added to Today',title);save();preserveRender();toast('Added to Today')}
function mealJournal(owner){return `<div class="meal-journal">${['Breakfast','Lunch','Dinner','Snack'].map(slot=>{const m=state[owner].meals[slot]||{text:'',photo:''};return `<button class="meal" data-action="meal-open" data-owner="${owner}" data-slot="${slot}">${m.photo?`<div class="meal-thumb" style="background-image:url('${m.photo}')"></div>`:`<div class="meal-thumb">${slot[0]}</div>`}<div class="meal-copy"><b>${slot}</b><span>${esc(m.text||'Add meal')}</span></div></button>`}).join('')}</div>${mealTodayGallery(owner)}`}
function mealTodayGallery(owner){const items=(state[owner].mealHistory||[]).filter(x=>localDateKey(new Date(x.at))===dayKey()&&(x.photo||x.text)).slice(-12).reverse();if(!items.length)return'';return `<div class="meal-gallery" aria-label="What I ate today">${items.map(x=>`<button class="meal-memory" data-action="meal-history-open" data-owner="${owner}" data-id="${x.id}" ${x.photo?`style="background-image:url('${x.photo}')"`:`style="background:linear-gradient(145deg,#fde8dc,#eee8ff)"`}><span>${esc(x.slot)} · ${esc(x.text||'photo')}</span></button>`).join('')}</div>`}
function waterCard(owner){const n=state[owner].water||0,slots=Math.max(8,Math.min(16,Math.ceil(Math.max(n,1)/4)*4)),shown=Math.min(slots,n),goal=8;return `<div class="visual-card water-card"><div class="signal-head"><div class="signal-title"><div class="eyebrow">Water</div><h3>${n>=goal?'Goal reached':'Hydrate'}</h3></div><div class="signal-count">${n}<small>glasses today</small></div></div><div class="hydration-line">${Array.from({length:slots},(_,i)=>`<span class="water-drop-mini ${i<shown?'on':''}" aria-hidden="true"></span>`).join('')}${n>slots?`<span class="water-extra">+${n-slots}</span>`:''}</div><div class="water-goal"><span>${Math.min(goal,n)}/${goal}</span><i><em style="width:${Math.min(100,n/goal*100)}%"></em></i><span>${n>=goal?'anything extra still counts':'daily guide'}</span></div><div class="signal-actions"><button class="secondary" data-action="water-minus" data-owner="${owner}" aria-label="Remove one glass">− 1</button><button class="primary" data-action="water-plus" data-owner="${owner}">+ 1 glass</button></div></div>`}
function moveCard(owner){const current=Array.isArray(state[owner].move)?state[owner].move:[];const isMoh=owner==='mohamad';const opts=isMoh?['Walk','Workout','Mobility','Stretch','Stairs','Dance']:['Walk','Dance','Stretch','Yoga','Stairs','Housework','Workout','Outside'];const icons={'Stretch':'↔','Walk':'→','Workout':'▲','Mobility':'◌','Dance':'♪','Outside':'☀','Yoga':'◇','Stairs':'↗','Housework':'⌂'};return `<div class="visual-card move-card ${isMoh?'moh-move':''}"><div class="signal-head"><div class="signal-title"><div class="eyebrow">${isMoh?'Body':'Move'}</div><h3>${current.length?`${current.length} ${current.length===1?'way':'ways'} you moved`:'What counted as movement?'}</h3></div><span class="category-dot">${current.length?current.map(x=>icons[x]||'•').slice(0,2).join(''):'↗'}</span></div><div class="movement-picked">${current.length?current.map(x=>`<span>${icons[x]||'•'} ${esc(x)}</span>`).join(''):`<span class="muted">Dancing, stairs and housework count too.</span>`}</div><div class="chiprow">${opts.map(x=>`<button class="chip ${current.includes(x)?'on':''}" data-action="move" data-owner="${owner}" data-value="${x}">${icons[x]||'•'} ${x}</button>`).join('')}</div></div>`}
function resetZone(){return `<div class="me-zone"><div class="eyebrow">Me</div><h2>What would help now?</h2><p class="small muted" style="max-width:570px">Pick the need. Every option opens a tiny bank — no generic wellness homework.</p><div class="reset-grid">${Object.entries(RESET_BANK).map(([k,v])=>`<button class="reset-option" data-action="reset-open" data-kind="${esc(k)}"><b>${v.icon} ${esc(k)}</b><span>${esc(v.sub)}</span></button>`).join('')}</div></div>`}
function laterShelf(){const tab=window.__laterTab||'Listen';const items=state.aya.later[tab]||[];return `<div class="panel"><div class="between"><div><div class="eyebrow">Later Shelf</div><h3 class="display" style="font-size:26px;margin:4px 0">Saved without turning life into tasks</h3></div><button class="secondary" data-action="later-add" data-type="${tab}">+ Save</button></div><div class="media-tabs" style="margin-top:13px">${LATER_TYPES.map(t=>`<button class="media-tab ${tab===t?'on':''}" data-action="later-tab" data-value="${t}">${t}</button>`).join('')}</div>${items.length?`<div class="media-list">${items.map(i=>`<div class="media-item"><b>${esc(i.title)}</b><span>${esc(i.note||'Saved for later')}</span><div class="row" style="margin-top:10px"><button class="softbtn" data-action="later-plan" data-type="${tab}" data-id="${i.id}">Plan in week</button><button class="textbtn" data-action="later-remove" data-type="${tab}" data-id="${i.id}">Remove</button></div></div>`).join('')}</div>`:`<div class="empty">Nothing saved in ${tab} yet.</div>`}</div>`}
function renderHome(){document.body.dataset.space='home';return `${topbar()}<div class="home"><div class="home-head"><h1>OneSpace</h1></div><div class="portal-grid"><button class="portal aya" data-go="aya/today" aria-label="Open Aya's space"><div><h2>Aya</h2></div><div class="portal-visual" aria-hidden="true"><div class="portal-glyph"></div></div></button><button class="portal mohamad" data-go="mohamad/today" aria-label="Open Mohamad's space"><div><h2>Mohamad</h2></div><div class="portal-visual" aria-hidden="true"><div class="portal-glyph"></div></div></button><button class="portal us" data-go="together/us" aria-label="Open the shared space"><div><h2>Together</h2></div><div class="portal-visual" aria-hidden="true"><div class="portal-glyph"></div></div></button></div></div>`}
function mindShelf(){const notes=(state.aya.mind||[]).slice(0,3);return `<div class="panel soft mind-shelf"><div><div class="eyebrow">Clear mind journal</div><h3 class="display" style="font-size:25px;margin:4px 0 10px">Put it somewhere safe</h3><div class="mind-notes">${notes.length?notes.map(n=>`<div class="mind-note">${esc(n.text)}<small>${new Date(n.at).toLocaleDateString()}</small></div>`).join(''):`<p class="small muted" style="margin:0">No note has to become a task. Write first, decide later.</p>`}</div></div><button class="primary accent" data-action="mind-open">Write</button></div>`}
function renderAyaToday(){const basics=state.aya.home;return shell('aya','aya/today',`${feelingBand('aya')}<section class="section">${sectionHead('Today','Add what you know, or use + to open your real work areas.')}<div class="panel"><div class="task-compose"><input id="ayaTodo" class="input" placeholder="What do you need to do today?"><button class="roundplus" data-action="aya-picker" aria-label="Choose something to add to Today">+</button></div>${taskRows('aya',state.aya.todos)}</div></section><section class="section">${sectionHead('Daily rhythm','A visual record of what actually happened today.')}<div class="daily-grid">${waterCard('aya')}${moveCard('aya')}</div><div class="panel" style="margin-top:12px"><div class="between"><div><div class="eyebrow">Food</div><h3 class="display" style="font-size:24px;margin:3px 0">Meals today</h3></div><span class="tiny muted">text, photo, and today’s gallery</span></div><div style="margin-top:10px">${mealJournal('aya')}</div></div></section><section class="section">${sectionHead('Home today','The basics stay light; one deeper thing can join Today.')}<div class="panel"><div class="chiprow">${Object.keys(basics).map(k=>`<button class="chip ${basics[k]?'on':''}" data-action="home-basic" data-value="${esc(k)}">${basics[k]?'✓ ':''}${esc(k)}</button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="softbtn" data-action="deep-clean-open">＋ Deep clean</button>${state.aya.deepToday?`<span class="chip on">Today: ${esc(state.aya.deepToday)}</span>`:''}</div></div></section><section class="section">${resetZone()}</section><section class="section">${mindShelf()}</section><section class="section">${laterShelf()}</section>`)}
function renderAyaGrow(){return shell('aya','aya/grow',`${pageHead('Grow','Open an area and see the full prepared bank. The system provides the structure; you choose what belongs in today.')}<div class="area-list">${Object.entries(CAREER_AREAS).map(([k,a])=>`<button class="area-row ${a.cls}" data-go="aya/grow/${k}"><span class="area-icon">${a.icon}</span><div><h3>${a.label}</h3><p>${a.sub}</p></div><span class="go">→</span></button>`).join('')}</div>`)}
function interiorPortfolioOverview(){const briefs=Object.values(INTERIOR).reduce((n,x)=>n+Object.keys(x.scenes).length,0),work=Object.values(state.aya.interior||{}).reduce((n,space)=>n+Object.values(space||{}).reduce((m,scene)=>m+(scene.work?.length||0),0),0),finals=Object.values(state.aya.gallery||{}).reduce((n,x)=>n+(x?.length||0),0);return `<div class="portfolio-overview"><div class="portfolio-stat"><b>${briefs}</b><span>room briefs</span></div><div class="portfolio-stat"><b>${work}</b><span>work files saved</span></div><div class="portfolio-stat"><b>${finals}</b><span>portfolio finals</span></div></div>`}
function drawingSet(space,scene,saved){const done=saved.drawings||[];return `<div class="drawing-set">${INTERIOR_DRAWING_SET.map(([title,detail],i)=>`<button class="drawing-card ${done.includes(i)?'done':''}" data-action="interior-drawing" data-space="${esc(space)}" data-scene="${esc(scene)}" data-index="${i}"><i>${done.includes(i)?'✓':i+1}</i><span><b>${esc(title)}</b><span>${esc(detail)}</span></span><strong>${done.includes(i)?'Done':'Mark'}</strong></button>`).join('')}</div>`}
function renderInteriorSpaces(){return shell('aya','aya/grow',`${pageHead('Interior Studio','Choose a space, then a realistic practice scene. Each scene has fixed dimensions, openings and a step-by-step path.')}${interiorPortfolioOverview()}<div class="spacegrid">${Object.entries(INTERIOR).map(([name,x])=>{const gal=state.aya.gallery[name]||[];const cover=gal.at(-1)?.src;return `<button class="spacecard" data-go="aya/interior/${encodeURIComponent(name)}"><div class="spacevisual ${x.class}" ${cover?`style="background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url('${cover}');background-size:cover;background-position:center"`:''}></div><div class="spacecopy"><h3>${esc(name)}</h3><span>${Object.keys(x.scenes).length} practice scenes${gal.length?` · ${gal.length} final saved`:''}</span></div></button>`}).join('')}</div><div class="notice" style="margin-top:16px">Training briefs use fixed practice dimensions so you can compare decisions. They are not building-code minimums. Real projects must use measured site conditions, local requirements and manufacturer data.</div>`)}
function renderInteriorSpace(name){const x=INTERIOR[name];if(!x)return renderInteriorSpaces();return shell('aya','aya/grow',`${pageHead(name,`Choose any scene. You do not have to start with the first one.`)}<div class="scenegrid">${Object.entries(x.scenes).map(([scene,b])=>`<button class="scene" data-go="aya/interior/${encodeURIComponent(name)}/${encodeURIComponent(scene)}"><div class="eyebrow">Practice scene</div><h3>${esc(scene)}</h3><p>${esc(b.brief)}</p></button>`).join('')}</div>${state.aya.gallery[name]?.length?`<section class="section">${sectionHead(`${name} gallery`,'Final work accumulates here over time.')}<div class="workgallery">${state.aya.gallery[name].map(g=>`<div class="workshot" style="background-image:url('${g.src}')"><span>${esc(g.scene)}</span></div>`).join('')}</div></section>`:''}`)}
function planSvg(space,scene,b){const W=520,H=330,maxW=360,maxH=220,scale=Math.min(maxW/b.w,maxH/b.l),rw=b.w*scale,rh=b.l*scale,x=(W-rw)/2,y=52+(maxH-rh)/2,door=Math.min(.9*scale,rw*.28),win=Math.min(1.6*scale,rw*.55);let f='';if(space==='Bedroom'){const bw=1.52*scale,bl=2.03*scale,bedX=x+(rw-bw)/2,bedY=y+rh*.23;const wardD=.6*scale,wardW=Math.min(2.2*scale,rw*.42);f=`<rect x="${bedX}" y="${bedY}" width="${bw}" height="${bl}" rx="7" class="plan-furn"/><rect x="${x+rw-wardD-8}" y="${y+rh*.18}" width="${wardD}" height="${wardW}" rx="5" class="plan-furn2"/><text x="${bedX+bw*.36}" y="${bedY+bl*.52}" class="plan-label">bed</text><text x="${x+rw-wardD-4}" y="${y+rh*.16}" class="plan-label">wardrobe</text>`}else if(space==='Living Room'){const sw=Math.min(2.3*scale,rw*.55),sd=.9*scale;f=`<rect x="${x+rw*.10}" y="${y+rh-sd-rh*.10}" width="${sw}" height="${sd}" rx="12" class="plan-furn2"/><rect x="${x+rw*.73}" y="${y+rh*.16}" width="${Math.min(1.8*scale,rw*.22)}" height="${Math.max(10,.12*scale)}" rx="3" class="plan-tv"/><rect x="${x+rw*.45}" y="${y+rh*.48}" width="${Math.min(.9*scale,rw*.20)}" height="${Math.min(.6*scale,rh*.20)}" rx="10" class="plan-furn"/><text x="${x+rw*.18}" y="${y+rh-sd*.45}" class="plan-label">sofa</text><text x="${x+rw*.76}" y="${y+rh*.13}" class="plan-label">TV</text>`}else if(space==='Kitchen'){const d=.6*scale;f=`<rect x="${x+8}" y="${y+8}" width="${d}" height="${rh-16}" class="plan-counter"/><rect x="${x+rw-d-8}" y="${y+8}" width="${d}" height="${rh-16}" class="plan-counter"/><text x="${x+rw*.40}" y="${y+rh*.52}" class="plan-label">work aisle</text>`}else if(space==='Bathroom'){const sh=.9*scale;f=`<rect x="${x+10}" y="${y+10}" width="${sh}" height="${sh}" rx="5" class="plan-water"/><circle cx="${x+rw*.72}" cy="${y+rh*.28}" r="${Math.min(.28*scale,28)}" class="plan-water"/><rect x="${x+rw*.55}" y="${y+rh*.67}" width="${Math.min(.9*scale,rw*.30)}" height="${Math.min(.45*scale,rh*.18)}" rx="5" class="plan-furn2"/><text x="${x+18}" y="${y+sh*.55}" class="plan-label">shower</text><text x="${x+rw*.58}" y="${y+rh*.65}" class="plan-label">vanity</text>`}else if(space==='TV Unit'){f=`<rect x="${x+rw*.10}" y="${y+rh*.20}" width="${rw*.80}" height="${rh*.60}" rx="5" class="plan-furn"/><rect x="${x+rw*.34}" y="${y+rh*.30}" width="${rw*.32}" height="${rh*.28}" rx="3" class="plan-tv"/><text x="${x+rw*.41}" y="${y+rh*.47}" fill="#fff" font-size="12" font-weight="800">TV zone</text>`}else{f=`<rect x="${x+rw*.10}" y="${y+rh*.22}" width="${rw*.24}" height="${rh*.50}" rx="20" class="plan-furn"/><rect x="${x+rw*.62}" y="${y+rh*.46}" width="${rw*.28}" height="${rh*.22}" rx="6" class="plan-furn2"/><text x="${x+rw*.66}" y="${y+rh*.59}" class="plan-label">storage</text>`}return `<div class="practice-plan"><div class="eyebrow" style="margin-bottom:7px">Scaled schematic plan · practice only</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scaled schematic room plan"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" class="plan-wall"/><line x1="${x+(rw-win)/2}" y1="${y}" x2="${x+(rw+win)/2}" y2="${y}" class="plan-window"/><text x="${x+rw/2-32}" y="${y-12}" class="plan-label">window</text><path d="M ${x} ${y+rh-door} L ${x+door} ${y+rh-door} A ${door} ${door} 0 0 0 ${x} ${y+rh}" class="plan-door"/><text x="${x+8}" y="${y+rh-door-8}" class="plan-label">door</text>${f}<line x1="${x}" y1="${y+rh+20}" x2="${x+rw}" y2="${y+rh+20}" stroke="#8c8290" stroke-width="1"/><text x="${x+rw/2-36}" y="${y+rh+39}" class="plan-dim">Width ${b.w.toFixed(1)} m</text><text x="${Math.max(18,x-35)}" y="${y+rh/2}" class="plan-dim" transform="rotate(-90 ${Math.max(18,x-35)} ${y+rh/2})">Length ${b.l.toFixed(1)} m</text></svg></div>`}
function ceilingSvg(space,b){const g=CEILING_GUIDE[space]||CEILING_GUIDE.Bedroom,W=520,H=320,maxW=360,maxH=210,scale=Math.min(maxW/b.w,maxH/b.l),rw=b.w*scale,rh=b.l*scale,x=(W-rw)/2,y=55+(maxH-rh)/2;const pts=space==='Kitchen'?[[.22,.28],[.50,.28],[.78,.28],[.22,.72],[.50,.72],[.78,.72]]:space==='Bathroom'?[[.30,.30],[.70,.30],[.50,.72]]:[[.28,.30],[.72,.30],[.28,.72],[.72,.72]];return `<div class="ceiling-card"><div class="eyebrow">Reflected ceiling concept · practice</div><h4>${esc(g.title)}</h4><p class="tiny muted">Practice ceiling height: ${practiceHeight(space,b).toFixed(1)} m. Design assumption only — not a site measurement or electrical drawing.</p><div class="ceiling-plan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conceptual reflected ceiling plan"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="4" class="ceiling-line"/>${pts.map(([px,py])=>`<circle cx="${x+rw*px}" cy="${y+rh*py}" r="12" class="ceiling-light"/><circle cx="${x+rw*px}" cy="${y+rh*py}" r="4" fill="#fff"/>`).join('')}<path d="M ${x+rw*.10} ${y+rh*.86} H ${x+rw*.90}" class="ceiling-strip"/><text x="${x}" y="${y+rh+28}" class="ceiling-note">${esc(g.lights[0])}</text><text x="${x}" y="${y+rh+44}" class="ceiling-note">${esc(g.lights[1]||'')}</text></svg></div></div>`}
function renderInteriorScene(space,scene){const b=INTERIOR[space]?.scenes?.[scene];if(!b)return renderInteriorSpace(space);const phase=(new URLSearchParams(location.hash.split('?')[1]||'')).get('phase')||'Look';const saved=state.aya.interior?.[space]?.[scene]||{};const works=saved.work||[];const cg=CEILING_GUIDE[space]||CEILING_GUIDE.Bedroom;return shell('aya','aya/grow',`${pageHead(scene,`${space} · practice project`)}<div class="panel soft"><div class="between"><div><div class="eyebrow">Project brief</div><h3 class="display" style="font-size:27px;margin:4px 0">Work from fixed conditions, like a real brief</h3></div><span class="chip">Practice project</span></div><div class="brief" style="margin-top:12px"><div class="brief-cell"><span>Width</span><b>${b.w.toFixed(1)} m</b></div><div class="brief-cell"><span>Length</span><b>${b.l.toFixed(1)} m</b></div><div class="brief-cell"><span>Ceiling</span><b>${practiceHeight(space,b).toFixed(1)} m</b></div></div><div class="grid2" style="margin-top:12px"><div><p class="small" style="margin:0 0 7px"><b>Client / use</b><br>${esc(b.brief)}</p></div><div><p class="small" style="margin:0"><b>Main challenge</b><br>${esc(b.challenge)}</p></div></div><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:850;font-size:13px">Fixed site conditions</summary><div class="bank-section" style="margin-top:8px">${b.fixed.map(x=>`<div class="bank-row"><div><b>${esc(x)}</b></div></div>`).join('')}</div></details><div class="project-drawings">${planSvg(space,scene,b)}${ceilingSvg(space,b)}</div><div class="project-cues"><div class="project-cue"><div class="eyebrow">Ceiling intent</div><h4>${esc(cg.title)}</h4><p>${esc(cg.lights.join(' · '))}</p></div><div class="project-cue"><div class="eyebrow">Wall / elevation focus</div><h4>Develop one vertical story</h4><p>${esc(cg.wall)}</p></div><div class="project-cue"><div class="eyebrow">Real-project habit</div><h4>Check before styling</h4><p>Verify circulation, furniture depth, openings and service constraints before choosing finishes.</p></div></div></div><section class="section" id="interior-phase-zone"><div class="phasebar">${INTERIOR_PHASES.map(p=>`<button class="phase ${phase===p?'on':''}" data-action="interior-phase" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${esc(p)}">${p}</button>`).join('')}</div><div class="panel"><div class="between"><div><div class="eyebrow">${esc(phase)}</div><h3 class="display" style="font-size:26px;margin:3px 0">Work this phase step by step</h3></div><button class="secondary" data-action="interior-upload" data-space="${esc(space)}" data-scene="${esc(scene)}">+ Work image</button></div><div class="bank-section">${INTERIOR_TASKS[phase].map(([t,d],i)=>{const done=saved[phase]?.includes(i);return `<div class="bank-row"><div><b>${done?'✓ ':''}${esc(t)}</b><p>${esc(d)}</p></div><div class="row"><button class="softbtn" data-action="interior-today" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${phase}" data-index="${i}">+ Today</button><button class="secondary" data-action="interior-done" data-space="${esc(space)}" data-scene="${esc(scene)}" data-phase="${phase}" data-index="${i}">${done?'Undo':'Done'}</button></div></div>`}).join('')}</div></div></section><section class="section">${sectionHead('Work gallery','Every sketch, plan and final board stays with this scene and builds your gallery over time.')}<div class="workgallery">${works.map(w=>`<div class="workshot" style="background-image:url('${w.src}')"><span>${esc(w.label||'work')}</span></div>`).join('')}<button class="workshot" data-action="interior-upload" data-space="${esc(space)}" data-scene="${esc(scene)}"><span>+ add</span></button></div><div class="row" style="margin-top:12px"><button class="primary accent" data-action="interior-final" data-space="${esc(space)}" data-scene="${esc(scene)}">Save final image to ${esc(space)} gallery</button></div></section>`)}

function incomeGuide(path,title,detail){
 const common={
  'Choose one skill you can deliver now':['Pick ONE thing to test for the next 2 weeks — not your forever career.','Try one of these starting points: content/social support from existing assets · Arabic/English translation/editing · presentation/design support · simple operations/admin support. Write exactly what you would deliver.'],
  'Choose one buyer':['Make the buyer specific enough that you could find 10 of them today.','Instead of “businesses”, write something like: small interior studios in Lebanon that finish good projects but do not turn them into consistent content.'],
  'Define one small problem':['Write the annoying moment the buyer already experiences — no solution yet.','Formula: “When ___ happens, they struggle to ___, which costs them ___.”'],
  'Write the one-sentence offer':['Turn buyer + problem + deliverable into one normal sentence.','Example: “I help small interior studios turn finished projects into a ready-to-post content pack.”'],
  'Choose a pilot price':['Pick a test price you can actually say out loud to a real buyer.','Write the price + what is included. The goal is to test a reaction, not discover the perfect lifetime price.'],
  'Choose one repeated problem':['Start from something you already organize, explain or solve repeatedly.','Write 3 repeated problems, then choose the one that is frequent + specific + annoying enough that someone already looks for a workaround.'],
  'Choose one narrow buyer':['Choose the person with the strongest version of the problem.','Write: role/life situation + context + what they are trying to get done.'],
  'Make the smallest useful version':['Build only the smallest artifact that produces one useful outcome.','Example: not a 70-page planner; a focused weekly planning pack that solves one recurring planning problem.'],
  'Name the first user':['Describe the first user by situation, not age/gender alone.','For OneSpace: someone juggling personal life + work + shared responsibilities who currently keeps things across notes, WhatsApp, memory and separate apps.'],
  'Describe the painful moment':['Describe WHEN the problem becomes painful.','Example: “I know what I want long-term, but every morning I still have to decide from zero what matters today.”'],
  'List current alternatives':['List what they really use now, even if it is messy.','Notes · WhatsApp to self/partner · calendar · Notion · paper planner · memory · separate habit/finance apps.'],
  'Choose one core promise':['Choose the change the user should feel — not a feature list.','Example: “I do not have to hold everything in my head, and the next useful move is easier to see.”'],
  'Test one workflow outside Aya/Mohamad':['Give ONE workflow to a real outside user and watch silently.','Set a task like: add something to today, find a growth move, or save something for the future home. Note every hesitation before explaining.'],
  'Write every friction point':['Record behavior, not opinions only.','Write: where they paused · what they expected · what happened · severity · possible cause.'],
  'Ask a value interview':['Ask about the useful moment, alternatives and return behavior.','Use: What would you come back for? What would this replace? What felt unnecessary? What would you be annoyed to lose?'],
  'Test willingness to pay':['Move from compliments to a concrete commercial signal.','Show a realistic offer/price and ask what they would do next: pay · join waitlist with deposit · book demo · decline and why.'],
  'Cut one weak feature':['Remove or hide one thing that does not strengthen the core loop.','Write what you are removing, what evidence made it weak, and what becomes clearer without it.'],
  'Improve the core loop':['Choose ONE friction in Context → Move → Outcome → Memory → Better next move.','Rewrite the before/after flow and test only that change.'],
  'Write the monthly decision':['Summarize evidence, not feelings.','Keep · Improve · Remove · Test next · price hypothesis. Add the evidence that caused each decision.'],
  'Define the exact deliverable':['Write exactly what the buyer receives and what is NOT included.','Example: 4 feed posts + 6 Story frames + captions, delivered in 5 days, using the client’s existing photos; 1 revision round.'],
  'Make one sample':['Build a believable sample of the final deliverable before selling.','Use a real-looking example: one content pack, one translated page, one presentation board, or one organized workflow — not a moodboard about the service.'],
  'Show it to 3 real people':['Show the sample to people close to the buyer profile and ask specific questions.','Ask: What is clear? What feels useful? What would you change? Would this save you time/money? What would stop you from paying?'],
  'Make one direct offer':['Send the offer to one person who plausibly has the problem.','Message structure: context → problem you can help with → exact deliverable → pilot price / next step. No long pitch.'],
  'Record the signal':['Save what actually happened instead of “they seemed interested”.','Use: no reply · replied but no need · asked questions · asked price · wants to try · paid. Add exact words when useful.'],
  'Improve one thing':['Change only the weakest part shown by evidence.','If people understand it but reject price, test price/scope. If they do not understand it, fix message. If they do not care, revisit the problem/buyer.'],
  'Repeat with 5 better-fit people':['Run the same improved test with a better-fit group before redesigning the offer again.','Keep the core offer stable enough that you can compare responses.'],
  'Find 10 existing paid alternatives':['Search for products people already pay for that solve the same job.','Capture name · price · buyer · promised outcome · format · reviews/complaints. You are mapping demand, not copying design.'],
  'Capture the gap':['Turn competitor/review observations into one testable gap.','Example: existing planners are beautiful but generic; users still have to translate long-term goals into today’s actions themselves.'],
  'Write the outcome':['Describe the change after use, not the file format.','“Know what to do this week without rebuilding the plan from zero” is stronger than “a 25-page PDF planner.”'],
  'Create a realistic mockup':['Show the product close enough to reality that someone can react to it.','Use 3–5 screens/pages that demonstrate the core outcome and what they receive.'],
  'Show it to 5 target people':['Watch them react/use it; do not only ask if they like it.','Record what they open first, ignore, misunderstand, want added, and whether they ask how to get it.'],
  'Pick a test price':['Choose a price hypothesis based on alternatives + value + scope.','Save one primary price and one reason. Do not create 6 tiers before the first sale.'],
  'Create one simple sales page':['Create only what someone needs to decide.','Problem → outcome → what is included → proof/mockup → price → one CTA.'],
  'Try to get one real transaction':['Ask for a real behavior with friction.','Payment is strongest; a deposit, paid pilot, or clear checkout attempt is stronger than “I would buy this.”'],
  'Decide: keep / improve / stop':['Compare your success threshold with what happened.','Write the evidence for the decision. “I still like the idea” is not evidence.'],
  'Only then expand':['Expand only the part proven useful.','Bundle, automate, add versions, or improve design after you know which outcome people value.'],
  'Test again with a new person':['Repeat the same core test with someone who did not watch you build it.','If the product only works when you explain it live, the experience still has a clarity problem.']
 };
 const g=common[title]||['Do the step as a concrete output, not as a thought.','Write the decision/evidence you produced. If you cannot show an output, make the step smaller.'];
 return {how:g[0],example:g[1],detail};
}
function blueprintStages(path,tasks){
 if(path.includes('product validation'))return [['Problem & promise',0,4],['Test the experience',4,7],['Commercial evidence',7,8],['Decide & iterate',8,tasks.length]];
 if(path.includes('simple service'))return [['Offer foundation',0,6],['Proof',6,8],['Sell & signal',8,10],['Improve',10,tasks.length]];
 if(path.includes('digital product'))return [['Problem & buyer',0,5],['Build small',5,7],['Test demand',7,11],['Decide',11,tasks.length]];
 return [['Foundation',0,Math.ceil(tasks.length*.35)],['Build',Math.ceil(tasks.length*.35),Math.ceil(tasks.length*.60)],['Test',Math.ceil(tasks.length*.60),Math.ceil(tasks.length*.85)],['Decide',Math.ceil(tasks.length*.85),tasks.length]];
}
function renderIncomeBlueprint(path){const tasks=INCOME_PATHS[path]||[];state.aya.blueprints[path]??={steps:{}};const ws=state.aya.blueprints[path],done=Object.keys(ws.steps||{}).filter(k=>ws.steps[k]?.answer?.trim()).length;const stages=blueprintStages(path,tasks);return shell('aya','aya/grow',`${pageHead(path,'This is a working blueprint. Each step should leave behind a decision, artifact, test or evidence — not just a checked box.')}<div class="row" style="margin-bottom:12px"><button class="secondary" data-go="aya/grow/income">← Income Lab</button></div><div class="blueprint-head"><div><div class="eyebrow">Blueprint progress</div><h3>${done} / ${tasks.length} outputs saved</h3><p>Assumptions become tests; tests become evidence; evidence changes the plan.</p></div><div class="blueprint-ring" style="--p:${tasks.length?Math.round(done/tasks.length*100):0}"><b>${tasks.length?Math.round(done/tasks.length*100):0}%</b></div></div><div class="blueprint-stages">${stages.map(([label,a,z])=>`<section class="blueprint-stage"><div class="blueprint-stage-head"><span>${esc(label)}</span><small>${tasks.slice(a,z).filter((_,j)=>ws.steps[a+j]?.answer?.trim()).length}/${z-a}</small></div>${tasks.slice(a,z).map(([t,d],j)=>{const i=a+j,saved=ws.steps[i]?.answer||'',g=incomeGuide(path,t,d);return `<article class="blueprint-step ${saved?'done':''}"><div class="step-no">${String(i+1).padStart(2,'0')}</div><div class="step-copy"><b>${esc(t)}</b><p>${esc(g.how)}</p>${saved?`<div class="saved-output">${esc(saved)}</div>`:''}</div><div class="step-actions"><button class="primary" data-action="blueprint-open" data-path="${esc(path)}" data-index="${i}">${saved?'Edit output':'Work on it'}</button><button class="textbtn" data-action="bank-add" data-title="${esc(t)}" data-detail="${esc(g.how)}" data-source="Income">+ Today</button></div></article>`}).join('')}</section>`).join('')}</div>${done?`<section class="section">${sectionHead('Blueprint snapshot','The answers you have actually saved — useful for review, pricing and the next test.')}<div class="blueprint-snapshot">${tasks.map(([t],i)=>ws.steps[i]?.answer?`<div><span>${esc(t)}</span><b>${esc(ws.steps[i].answer)}</b></div>`:'').join('')}</div></section>`:''}`)}
function openBlueprintStep(path,index){const tasks=INCOME_PATHS[path]||[],item=tasks[index];if(!item)return;state.aya.blueprints[path]??={steps:{}};const saved=state.aya.blueprints[path].steps[index]?.answer||'',g=incomeGuide(path,item[0],item[1]);openModal(item[0],`Step ${index+1} of ${tasks.length} · ${path}`,`<div class="blueprint-guide"><div><span>What to do</span><p>${esc(g.how)}</p></div><div><span>Concrete example / check</span><p>${esc(g.example)}</p></div><div><span>Why this step exists</span><p>${esc(item[1])}</p></div></div><label class="form-label">My decision / evidence / output</label><textarea id="blueprintAnswer" class="textarea" placeholder="Write the actual output from this step…">${esc(saved)}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" data-action="blueprint-save" data-path="${esc(path)}" data-index="${index}">Save to blueprint</button></div>`,`Income · working blueprint`)}

function taskGuidance(title,detail,source=''){const words=`${title} ${detail}`.toLowerCase();let time=/write|list|choose|reply|save|ask|message/.test(words)?'5–10 min':/film|record|photograph|design|layout|carousel|reel|sample|board/.test(words)?'15–30 min':'10–20 min';let done=/choose|pick|decide/.test(words)?'One decision is written and the next action is clear.':/message|reply|ask|show/.test(words)?'The real message is sent to one relevant person.':/film|record|photograph|capture/.test(words)?'One usable take is saved; polishing can wait.':/review|compare|study|look/.test(words)?'One useful pattern is written, not only noticed.':/make|create|build|design|write/.test(words)?'A small usable version exists and can be reviewed.':'One visible action is completed and recorded.';const energy=/private|gently|comfort|notice|reflect/.test(words)?'Low pressure':/message|publish|send|offer|client/.test(words)?'Courage move':'Focused';return {time,done,energy,why:detail,source}}

iv>${items.length?`<section class="section">${sectionHead(current[0],'Only the real things you saved appear here.')}<div class="wish-grid">${items.slice(0,9).map(wishCard).join('')}</div></section>`:''}`)}

renderHomeCategory=function(cat){window.__homeLens??='choosing';window.__homeSubByCat??={};const all=state.together.wishlist.filter(x=>x.categoryGroup===cat),subs=HOME_CATS[cat]||[],sub=window.__homeSubByCat[cat]||'All',defs=homeLensDefs(),current=defs[window.__homeLens]||defs.choosing,items=all.filter(current[1]).filter(x=>sub==='All'||x.subcategory===sub);return shell('together','together/home',`<div class="row"><button class="textbtn" data-go="together/home">← Back to the feeling of home</button></div><div class="home-root" style="padding:35px 0"><div class="home-root-icon">${homeCategoryIcon(cat)}</div><h2>${esc(cat)}</h2><p>Choose one detail only when you want to look closer.</p></div><div class="home-category-flow"><button class="home-category-word ${sub==='All'?'on':''}" data-action="home-sub" data-cat="${esc(cat)}" data-value="All"><b>Everything</b><span>${all.length} saved</span></button>${subs.map(s=>{const n=all.filter(x=>x.subcategory===s).length;return `<button class="home-category-word ${sub===s?'on':''}" data-action="home-sub" data-cat="${esc(cat)}" data-value="${esc(s)}"><b>${esc(s)}</b><span>${n?`${n} saved`:'still open'}</span></button>`}).join('')}</div><div class="home-progress-line">${Object.entries(defs).map(([key,[label,fn]])=>`<button class="${window.__homeLens===key?'on':''}" data-action="home-lens" data-value="${key}"><b>${all.filter(fn).filter(x=>sub==='All'||x.subcategory===sub).length}</b><span>${label}</span></button>`).join('')}</div><div class="row" style="justify-content:center;margin:24px 0"><button class="primary" data-action="wish-add-sub" data-group="${esc(cat)}" data-sub="${esc(sub==='All'?(subs[0]||'Other'):sub)}">＋ Save something here</button></div>${items.length?`<div class="wish-grid">${items.map(wishCard).join('')}</div>`:`<p class="small muted" style="text-align:center;margin:40px 0">This part of the home is still open. It does not need filler.</p>`}`)}

function planOpenings(layout,x,y,rw,rh,scale){const door=Math.min(.9*scale,rw*.27),win=Math.min(1.8*scale,layout.window==='left'||layout.window==='right'?rh*.48:rw*.48);let s='';if(layout.door==='bottom-left')s+=`<path d="M ${x} ${y+rh-door} L ${x+door} ${y+rh-door} A ${door} ${door} 0 0 0 ${x} ${y+rh}" class="plan-door"/>`;if(layout.door==='bottom-right')s+=`<path d="M ${x+rw} ${y+rh-door} L ${x+rw-door} ${y+rh-door} A ${door} ${door} 0 0 1 ${x+rw} ${y+rh}" class="plan-door"/>`;if(layout.door==='left-bottom')s+=`<path d="M ${x} ${y+rh} L ${x+door} ${y+rh} A ${door} ${door} 0 0 0 ${x} ${y+rh-door}" class="plan-door"/>`;if(layout.window==='top'||layout.window==='top-open')s+=`<line x1="${x+(rw-win)/2}" y1="${y}" x2="${x+(rw+win)/2}" y2="${y}" class="plan-window"/>`;if(layout.window==='right')s+=`<line x1="${x+rw}" y1="${y+(rh-win)/2}" x2="${x+rw}" y2="${y+(rh+win)/2}" class="plan-window"/>`;if(layout.window==='left')s+=`<line x1="${x}" y1="${y+(rh-win)/2}" x2="${x}" y2="${y+(rh+win)/2}" class="plan-window"/>`;return s}
function planItems(layout,x,y,rw,rh,ghost=false){return layout.items.map(([type,px,py,pw,ph,label])=>{const X=x+rw*px,Y=y+rh*py,W=rw*pw,H=rh*ph,cls=ghost?'':' '+(type==='counter'||type==='storage'?'plan-counter':type==='shower'||type==='wc'?'plan-water':type==='tv'?'plan-tv':'plan-furn2');const style=ghost?'fill:none;stroke:#9b92a1;stroke-width:1.5;stroke-dasharray:5 5':'';const shape=type==='wc'?`<ellipse cx="${X+W/2}" cy="${Y+H/2}" rx="${W/2}" ry="${H/2}" style="${style}" class="${cls.trim()}"/>`:`<rect x="${X}" y="${Y}" width="${W}" height="${H}" rx="${Math.min(10,H*.18)}" style="${style}" class="${cls.trim()}"/>`;return `${shape}${!ghost&&label?`<text x="${X+6}" y="${Y+Math.min(H-5,18)}" class="plan-label">${esc(label)}</text>`:''}`}).join('')}

async function fileData(id){const input=$('#'+id),f=input?.files?.[0];if(!f)return'';const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(!f.type.startsWith('image/'))return raw;return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>resolve(raw);img.src=raw})}

 if(a==='wish-save'){const title=$('#wishTitle').value.trim();if(!title)return;const id=b.dataset.id,group=$('#wishGroup').value,photo=await fileData('wishPhoto');let w=id?state.together.wishlist.find(x=>x.id===id):null;if(!w){w={id:uid(),status:'planned',by:CONFIG.user.name,at:now()};state.together.wishlist.unshift(w)}w.categoryGroup=group;w.subcategory=$('#wishSub').value;w.title=title;w.price=Number($('#wishPrice').value||0)||null;w.priority=$('#wishPriority').value;w.link=$('#wishLink').value.trim();w.photo=photo||w.photo||'';record('together','home','Future-home item saved',`${group} · ${title}`);save();closeModal();preserveRender();return}
 if(a==='home-group'){window.__homeGroup=b.dataset.value;preserveRender();return}
 if(a==='home-door-select'){window.__homeDoorByGroup??={};window.__homeDoorByGroup[b.dataset.group]=b.dataset.value;preserveRender();return}
 if(a==='home-lens'){window.__homeLens=b.dataset.value;preserveRender();return}
 if(a==='home-sub'){window.__homeSubByCat??={};window.__homeSubByCat[b.dataset.cat]=b.dataset.value;preserveRender();return}
 if(a==='home-item-view'){window.__homeItemView=b.dataset.value;preserveRender();return}
 if(a==='home-cat'){openHomeCat(b.dataset.cat);return}
 if(a==='wish-bought'){const w=state.together.wishlist.find(x=>x.id===b.dataset.id);if(w){w.status='bought';w.boughtAt=now();record('together','home','Item bought',w.title);save();if(w.price){openModal('Marked bought','Do you want the entered price to appear as an expense in Our Money?',`<div class="row"><button class="primary" data-action="wish-expense" data-id="${w.id}">Yes · record $${w.price}</button><button class="secondary" data-action="close-modal">Not now</button></div>`,'Together · Future Home')}else{preserveRender();toast('Moved to Already bought')}}return}
 if(a==='wish-unbuy'){const w=state.together.wishlist.find(x=>x.id===b.dataset.id);if(w){w.status='planned';w.boughtAt='';record('together','home','Purchase status reopened',w.title);save();preserveRender()}return}
 if(a==='wish-expense'){const w=state.together.wishlist.find(x=>x.id===b.dataset.id);if(w?.price){state.together.ledger.unshift({id:uid(),type:'Expense',amount:Number(w.price),note:w.title,by:CONFIG.user.name,at:now(),source:'future-home'});record('together','money','Home expense recorded',`${w.title} · $${w.price}`);save()}closeModal();go('together/home');return}
 if(a==='open-link'){window.open(b.dataset.url,'_blank','noopener');return}
 if(a==='ledger-add'){openLedger();return}
 if(a==='ledger-save'){const type=$('#ledgerType').value,amount=Number($('#ledgerAmount').value||0),note=$('#ledgerNote').value.trim(),goal=$('#ledgerGoal').value;if(amount>0){state.together.ledger.unshift({id:uid(),type,amount,note,goal:goal||'',by:CONFIG.user.name,at:now()});if(type==='Saving'&&goal){const g=state.together.goals.find(x=>x.id===goal);if(g)g.saved=(g.saved||0)+amount}record('together','money',`${type} recorded`,`${note} · $${amount}`);save()}closeModal();preserveRender();return}
 if(a==='goal-add'){openGoal();return}
 if(a==='goal-edit'){openGoal(state.together.goals.find(x=>x.id===b.dataset.id));return}
 if(a==='goal-save'){const id=b.dataset.id,name=$('#goalName').value.trim();if(!name)return;let g=id?state.together.goals.find(x=>x.id===id):null;if(!g){g={id:uid(),photo:''};state.together.goals.push(g)}g.name=name;g.target=$('#goalTarget').value?Number($('#goalTarget').value):null;g.saved=Number($('#goalSaved').value||0);const photo=await fileData('goalPhoto');g.photo=photo||g.photo||'';save();closeModal();preserveRender();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on')){closeModal();return}if(e.key==='Enter'&&e.target.id==='leadSearch'){window.__leadSearch=e.target.value.trim();window.__openLead='';preserveRender();return}if(e.key==='Enter'&&e.target.id==='ayaTodo'&&e.target.value.trim()){addTask('aya',e.target.value.trim(),'','My own');e.target.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='wishGroup'){const g=e.target.value,s=$('#wishSub');if(s)s.innerHTML=(HOME_CATS[g]||['Other']).map(x=>`<option>${esc(x)}</option>`).join('')}});
$('#scrim').addEventListener('click',closeModal);
render(true);
</script>
</body>
</html>
